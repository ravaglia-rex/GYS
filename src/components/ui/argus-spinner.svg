<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor">
  <title>Argus — Loading Spinner (Motion State 02 · Inference)</title>
  <!-- Outer ring stays put; frames the motion. -->
  <circle cx="100" cy="100" r="92" stroke-width="5"/>

  <!-- Outer iris blades · rotate clockwise · 6s -->
  <g stroke-width="3.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 100 100" to="360 100 100"
                      dur="6s" repeatCount="indefinite"/>
    <path d="M 119.2 28.5 A 74 74 0 0 1 171.5 80.8"/>
    <path d="M 171.5 119.2 A 74 74 0 0 1 119.2 171.5"/>
    <path d="M 80.8 171.5 A 74 74 0 0 1 28.5 119.2"/>
    <path d="M 28.5 80.8 A 74 74 0 0 1 80.8 28.5"/>
  </g>

  <!-- Inner iris blades · rotate counter-clockwise · 4s -->
  <g stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 100 100" to="-360 100 100"
                      dur="4s" repeatCount="indefinite"/>
    <path d="M 75 56.7 A 50 50 0 0 1 125 56.7"/>
    <path d="M 143.3 75 A 50 50 0 0 1 143.3 125"/>
    <path d="M 125 143.3 A 50 50 0 0 1 75 143.3"/>
    <path d="M 56.7 125 A 50 50 0 0 1 56.7 75"/>
  </g>

  <!-- Pupil · pulse 13 → 15.5 → 13 · 2s · ease-in-out -->
  <circle cx="100" cy="100" r="13" fill="currentColor" stroke="none">
    <animate attributeName="r" values="13;15.5;13"
             dur="2s" repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0; 0.5; 1"
             keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
  </circle>
</svg>
