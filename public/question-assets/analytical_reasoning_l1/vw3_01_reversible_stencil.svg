<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <rect width="1100" height="650" fill="#ffffff"/>
  <style>
    .title{font:700 25px Arial,sans-serif;fill:#24334b}.label{font:700 21px Arial,sans-serif;fill:#24334b}.note{font:17px Arial,sans-serif;fill:#53627a}.cell{fill:#fff;stroke:#66758b;stroke-width:2}.metal{fill:#44536a;stroke:#26354d;stroke-width:2}.open{fill:#fff;stroke:#26354d;stroke-width:2}.mark{font:32px Arial,sans-serif;fill:#17243a;text-anchor:middle;dominant-baseline:middle}
  </style>
  <text x="55" y="48" class="title">Test card</text>
  <g transform="translate(70 80)">
    <path d="M0 0h180v180H0zM60 0v180M120 0v180M0 60h180M0 120h180" class="cell"/>
    <text x="30" y="30" class="mark">★</text>
    <text x="90" y="90" class="mark">★</text>
    <text x="30" y="150" class="mark">●</text>
  </g>
  <g transform="translate(335 90)">
    <path d="M0 72c52-69 137-69 190 0" fill="none" stroke="#8b5e34" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="95" y="18" class="label" text-anchor="middle">Test each stencil twice</text>
    <text x="95" y="111" class="note" text-anchor="middle">as shown, then turned over left-to-right</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b5e34"/></marker></defs>
  <text x="55" y="330" class="title">Stencil options</text>
  <!-- A: openings TL, ML, C, BM -->
  <text x="46" y="392" class="label">A</text>
  <g transform="translate(75 360)">
    <rect width="54" height="54" x="0" y="0" class="open"/><rect width="54" height="54" x="54" y="0" class="metal"/><rect width="54" height="54" x="108" y="0" class="metal"/>
    <rect width="54" height="54" x="0" y="54" class="open"/><rect width="54" height="54" x="54" y="54" class="open"/><rect width="54" height="54" x="108" y="54" class="metal"/>
    <rect width="54" height="54" x="0" y="108" class="metal"/><rect width="54" height="54" x="54" y="108" class="open"/><rect width="54" height="54" x="108" y="108" class="metal"/>
  </g>
  <!-- B: openings TR, C, MR, BM -->
  <text x="316" y="392" class="label">B</text>
  <g transform="translate(345 360)">
    <rect width="54" height="54" x="0" y="0" class="metal"/><rect width="54" height="54" x="54" y="0" class="metal"/><rect width="54" height="54" x="108" y="0" class="open"/>
    <rect width="54" height="54" x="0" y="54" class="metal"/><rect width="54" height="54" x="54" y="54" class="open"/><rect width="54" height="54" x="108" y="54" class="open"/>
    <rect width="54" height="54" x="0" y="108" class="metal"/><rect width="54" height="54" x="54" y="108" class="open"/><rect width="54" height="54" x="108" y="108" class="metal"/>
  </g>
  <!-- C: openings TL, TR, ML, C -->
  <text x="586" y="392" class="label">C</text>
  <g transform="translate(615 360)">
    <rect width="54" height="54" x="0" y="0" class="open"/><rect width="54" height="54" x="54" y="0" class="metal"/><rect width="54" height="54" x="108" y="0" class="open"/>
    <rect width="54" height="54" x="0" y="54" class="open"/><rect width="54" height="54" x="54" y="54" class="open"/><rect width="54" height="54" x="108" y="54" class="metal"/>
    <rect width="54" height="54" x="0" y="108" class="metal"/><rect width="54" height="54" x="54" y="108" class="metal"/><rect width="54" height="54" x="108" y="108" class="metal"/>
  </g>
  <!-- D: openings TL, TR, ML, MR -->
  <text x="856" y="392" class="label">D</text>
  <g transform="translate(885 360)">
    <rect width="54" height="54" x="0" y="0" class="open"/><rect width="54" height="54" x="54" y="0" class="metal"/><rect width="54" height="54" x="108" y="0" class="open"/>
    <rect width="54" height="54" x="0" y="54" class="open"/><rect width="54" height="54" x="54" y="54" class="metal"/><rect width="54" height="54" x="108" y="54" class="open"/>
    <rect width="54" height="54" x="0" y="108" class="metal"/><rect width="54" height="54" x="54" y="108" class="metal"/><rect width="54" height="54" x="108" y="108" class="metal"/>
  </g>
  <rect x="55" y="590" width="20" height="20" class="open"/><text x="85" y="606" class="note">opening</text>
  <rect x="170" y="590" width="20" height="20" class="metal"/><text x="200" y="606" class="note">solid metal</text>
</svg>
