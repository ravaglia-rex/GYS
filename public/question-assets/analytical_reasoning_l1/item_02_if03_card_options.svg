<svg xmlns="http://www.w3.org/2000/svg" width="980" height="290" viewBox="0 0 980 290" role="img" aria-labelledby="title desc">
  <title id="title">Four possible transformed target cards</title>
  <desc id="desc">Four bordered two-by-two answer cards labelled A through D. Option A has right arrow and star above hollow circle and solid square. Option B has solid square and star above hollow circle and left arrow. Option C has down arrow and hollow circle above star and solid square. Option D has solid square and star above hollow circle and up arrow.</desc>
  <style>
    .card { fill:#fff; stroke:#263746; stroke-width:3; }
    .line { stroke:#a9b6c2; stroke-width:2; }
    .option { font:700 24px Arial,sans-serif; fill:#174a78; text-anchor:middle; }
    .symbol { font:700 42px "Arial Unicode MS","Noto Sans Symbols 2",Arial,sans-serif; fill:#1c3144; text-anchor:middle; dominant-baseline:middle; }
  </style>
  <rect width="980" height="290" fill="#fff"/>

  <text x="125" y="32" class="option">A</text>
  <rect x="45" y="50" width="160" height="160" rx="8" class="card"/><line x1="125" y1="50" x2="125" y2="210" class="line"/><line x1="45" y1="130" x2="205" y2="130" class="line"/>
  <text x="85" y="90" class="symbol">→</text><text x="165" y="90" class="symbol">★</text>
  <circle cx="85" cy="170" r="19" fill="#fff" stroke="#1c3144" stroke-width="3"/><rect x="146" y="151" width="38" height="38" fill="#1c3144"/>

  <text x="365" y="32" class="option">B</text>
  <rect x="285" y="50" width="160" height="160" rx="8" class="card"/><line x1="365" y1="50" x2="365" y2="210" class="line"/><line x1="285" y1="130" x2="445" y2="130" class="line"/>
  <rect x="306" y="71" width="38" height="38" fill="#1c3144"/><text x="405" y="90" class="symbol">★</text>
  <circle cx="325" cy="170" r="19" fill="#fff" stroke="#1c3144" stroke-width="3"/><text x="405" y="170" class="symbol">←</text>

  <text x="605" y="32" class="option">C</text>
  <rect x="525" y="50" width="160" height="160" rx="8" class="card"/><line x1="605" y1="50" x2="605" y2="210" class="line"/><line x1="525" y1="130" x2="685" y2="130" class="line"/>
  <text x="565" y="90" class="symbol">↓</text><circle cx="645" cy="90" r="19" fill="#fff" stroke="#1c3144" stroke-width="3"/>
  <text x="565" y="170" class="symbol">★</text><rect x="626" y="151" width="38" height="38" fill="#1c3144"/>

  <text x="845" y="32" class="option">D</text>
  <rect x="765" y="50" width="160" height="160" rx="8" class="card"/><line x1="845" y1="50" x2="845" y2="210" class="line"/><line x1="765" y1="130" x2="925" y2="130" class="line"/>
  <rect x="786" y="71" width="38" height="38" fill="#1c3144"/><text x="885" y="90" class="symbol">★</text>
  <circle cx="805" cy="170" r="19" fill="#fff" stroke="#1c3144" stroke-width="3"/><text x="885" y="170" class="symbol">↑</text>
</svg>
