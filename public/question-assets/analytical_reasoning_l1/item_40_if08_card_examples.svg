<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Two completed whole-card movements and one target</title>
  <desc id="desc">Example 1 moves a star from center-left to top-center and a diamond from center-right to bottom-center. Example 2 moves a triangle from upper-left to upper-right and a square from lower-right to lower-left. The target has a hollow circle upper-left, east-pointing arrow upper-right, star in the center, and diamond lower-left. Its output is missing. Every card is a bordered three-by-three grid; empty squares are blank.</desc>
  <defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#174a78"/></marker></defs>
  <style>
    .card { fill:#fff; stroke:#263746; stroke-width:2.8; }
    .grid { stroke:#aeb9c2; stroke-width:1.6; }
    .label { font:700 21px sans-serif; fill:#174a78; }
    .head { font:700 17px sans-serif; fill:#536775; text-anchor:middle; }
    .shape { font:700 38px "DejaVu Sans",sans-serif; fill:#172b3a; text-anchor:middle; dominant-baseline:middle; }
    .hollow { fill:#fff; stroke:#172b3a; stroke-width:2.7; }
    .solid { fill:#172b3a; stroke:#172b3a; stroke-width:2.2; }
    .direction { font:700 43px sans-serif; fill:#174a78; text-anchor:middle; dominant-baseline:middle; }
    .flow { stroke:#174a78; stroke-width:3; marker-end:url(#flow-arrow); }
    .missing { font:700 38px sans-serif; fill:#174a78; text-anchor:middle; dominant-baseline:middle; }
  </style>
  <rect width="1000" height="700" fill="#fff"/>
  <text class="head" x="370" y="28">BEFORE</text><text class="head" x="750" y="28">AFTER</text>

  <text class="label" x="35" y="145">EXAMPLE 1</text>
  <g transform="translate(280 45)">
    <rect class="card" width="180" height="180" rx="6"/><path class="grid" d="M60 0V180M120 0V180M0 60H180M0 120H180"/>
    <text class="shape" x="30" y="91">★</text><polygon class="solid" points="150,75 166,91 150,107 134,91"/>
  </g>
  <line class="flow" x1="500" y1="135" x2="620" y2="135"/>
  <g transform="translate(660 45)">
    <rect class="card" width="180" height="180" rx="6"/><path class="grid" d="M60 0V180M120 0V180M0 60H180M0 120H180"/>
    <text class="shape" x="90" y="31">★</text><polygon class="solid" points="90,135 106,151 90,167 74,151"/>
  </g>

  <text class="label" x="35" y="365">EXAMPLE 2</text>
  <g transform="translate(280 265)">
    <rect class="card" width="180" height="180" rx="6"/><path class="grid" d="M60 0V180M120 0V180M0 60H180M0 120H180"/>
    <polygon class="solid" points="30,14 15,46 45,46"/><rect class="solid" x="138" y="138" width="24" height="24"/>
  </g>
  <line class="flow" x1="500" y1="355" x2="620" y2="355"/>
  <g transform="translate(660 265)">
    <rect class="card" width="180" height="180" rx="6"/><path class="grid" d="M60 0V180M120 0V180M0 60H180M0 120H180"/>
    <polygon class="solid" points="150,14 135,46 165,46"/><rect class="solid" x="18" y="138" width="24" height="24"/>
  </g>

  <text class="label" x="35" y="585">TARGET</text>
  <g transform="translate(280 485)">
    <rect class="card" width="180" height="180" rx="6"/><path class="grid" d="M60 0V180M120 0V180M0 60H180M0 120H180"/>
    <circle class="hollow" cx="30" cy="30" r="13"/><text class="direction" x="150" y="31">→</text>
    <text class="shape" x="90" y="91">★</text><polygon class="solid" points="30,135 46,151 30,167 14,151"/>
  </g>
  <line class="flow" x1="500" y1="575" x2="620" y2="575"/>
  <g transform="translate(660 485)"><rect class="card" width="180" height="180" rx="6"/><text class="missing" x="90" y="91">?</text></g>
</svg>
