<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Two examples of a delivery box moving between rooms</title>
  <desc id="desc">Example one shows the box entering the attic: the inside and loose items exchange places while the clipped item remains clipped. Example two shows the box entering the right room: the clipped and loose items exchange places while the inside item remains inside.</desc>
  <style>
    .card { fill:#f8fafc; stroke:#b7c4ce; stroke-width:2; }
    .room { fill:#fff; stroke:#435765; stroke-width:2.2; }
    .room-name { font:700 15px sans-serif; fill:#31434f; text-anchor:middle; }
    .heading { font:700 18px sans-serif; fill:#263746; text-anchor:middle; }
    .example { font:700 21px sans-serif; fill:#174a78; }
    .move { fill:none; stroke:#174a78; stroke-width:3; marker-end:url(#arrow); }
    .move-label { font:700 15px sans-serif; fill:#174a78; text-anchor:middle; }
    .box { fill:#e9f3fb; stroke:#173f63; stroke-width:2.5; }
    .box-label { font:700 13px sans-serif; fill:#173f63; text-anchor:middle; }
    .inside { font:700 25px "DejaVu Sans",sans-serif; fill:#173f63; text-anchor:middle; dominant-baseline:middle; }
    .clip { fill:#fff8e8; stroke:#9b5b00; stroke-width:2.2; }
    .clip-line { stroke:#9b5b00; stroke-width:3; }
    .clip-symbol { font:700 19px "DejaVu Sans",sans-serif; fill:#7a4700; text-anchor:middle; dominant-baseline:middle; }
    .loose { font:700 26px "DejaVu Sans",sans-serif; fill:#4b2c71; text-anchor:middle; dominant-baseline:middle; }
    .state-label { font:14px sans-serif; fill:#536572; text-anchor:middle; }
    .empty { font:italic 15px sans-serif; fill:#7b8891; text-anchor:middle; }

    /* Optical-size normalization: role controls color; shape controls apparent size. */
    .shape-triangle { font-size:29px; }
    .shape-circle { font-size:52px; }
    .shape-square { font-size:68px; }
    .shape-diamond { font-size:56px; }
    .shape-star { font-size:31px; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#174a78"/></marker></defs>
  <rect width="1000" height="720" fill="#fff"/>

  <!-- Example 1 -->
  <text class="example" x="22" y="28">EXAMPLE 1</text>
  <rect class="card" x="20" y="42" width="460" height="295" rx="9"/>
  <rect class="card" x="520" y="42" width="460" height="295" rx="9"/>
  <text class="heading" x="250" y="69">BEFORE</text><text class="heading" x="750" y="69">AFTER</text>
  <rect class="room" x="43" y="88" width="190" height="220" rx="5"/><rect class="room" x="267" y="88" width="190" height="220" rx="5"/>
  <text class="room-name" x="138" y="112">LEFT ROOM</text><text class="room-name" x="362" y="112">ATTIC</text>
  <path class="move" d="M182 132H319"/><text class="move-label" x="250" y="126">MOVE</text>
  <g transform="translate(92 166)"><rect class="box" width="92" height="82" rx="6"/><text class="box-label" x="46" y="18">INSIDE</text><text class="inside shape-triangle" x="46" y="52">▲</text><path class="clip-line" d="M92 23H108"/><rect class="clip" x="106" y="8" width="72" height="60" rx="5"/><text class="clip-symbol shape-square" x="127" y="25">■</text><text class="state-label" x="127" y="77">clipped</text></g>
  <text class="loose shape-circle" x="362" y="200">●</text><text class="state-label" x="362" y="230">loose</text>

  <rect class="room" x="543" y="88" width="190" height="220" rx="5"/><rect class="room" x="767" y="88" width="190" height="220" rx="5"/>
  <text class="room-name" x="638" y="112">LEFT ROOM</text><text class="room-name" x="862" y="112">ATTIC</text><text class="empty" x="638" y="207">empty</text>
  <g transform="translate(792 159)"><rect class="box" width="92" height="82" rx="6"/><text class="box-label" x="46" y="18">INSIDE</text><text class="inside shape-circle" x="46" y="52">●</text><path class="clip-line" d="M92 23H108"/><rect class="clip" x="106" y="8" width="72" height="60" rx="5"/><text class="clip-symbol shape-square" x="127" y="25">■</text><text class="state-label" x="127" y="77">clipped</text></g>
  <text class="loose shape-triangle" x="922" y="268">▲</text><text class="state-label" x="922" y="294">loose</text>

  <!-- Example 2 -->
  <text class="example" x="22" y="378">EXAMPLE 2</text>
  <rect class="card" x="20" y="392" width="460" height="308" rx="9"/>
  <rect class="card" x="520" y="392" width="460" height="308" rx="9"/>
  <text class="heading" x="250" y="419">BEFORE</text><text class="heading" x="750" y="419">AFTER</text>
  <rect class="room" x="43" y="438" width="190" height="220" rx="5"/><rect class="room" x="267" y="438" width="190" height="220" rx="5"/>
  <text class="room-name" x="138" y="462">LEFT ROOM</text><text class="room-name" x="362" y="462">RIGHT ROOM</text>
  <path class="move" d="M182 482H319"/><text class="move-label" x="250" y="476">MOVE</text>
  <g transform="translate(92 516)"><rect class="box" width="92" height="82" rx="6"/><text class="box-label" x="46" y="18">INSIDE</text><text class="inside shape-diamond" x="46" y="52">◆</text><path class="clip-line" d="M92 23H108"/><rect class="clip" x="106" y="8" width="72" height="60" rx="5"/><text class="clip-symbol shape-star" x="127" y="25">★</text><text class="state-label" x="127" y="77">clipped</text></g>
  <text class="loose shape-square" x="362" y="550">□</text><text class="state-label" x="362" y="580">loose</text>

  <rect class="room" x="543" y="438" width="190" height="220" rx="5"/><rect class="room" x="767" y="438" width="190" height="220" rx="5"/>
  <text class="room-name" x="638" y="462">LEFT ROOM</text><text class="room-name" x="862" y="462">RIGHT ROOM</text><text class="empty" x="638" y="557">empty</text>
  <g transform="translate(792 509)"><rect class="box" width="92" height="82" rx="6"/><text class="box-label" x="46" y="18">INSIDE</text><text class="inside shape-diamond" x="46" y="52">◆</text><path class="clip-line" d="M92 23H108"/><rect class="clip" x="106" y="8" width="72" height="60" rx="5"/><text class="clip-symbol shape-square" x="127" y="25">□</text><text class="state-label" x="127" y="77">clipped</text></g>
  <text class="loose shape-star" x="922" y="618">★</text><text class="state-label" x="922" y="644">loose</text>
</svg>
