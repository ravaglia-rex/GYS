<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="title desc">
  <title id="title">Whole-card movement example, target, and four answer cards</title>
  <desc id="desc">An example shows a three by three card before and after a whole-card movement. A target card and four possible transformed cards are shown.</desc>
  <rect width="1240" height="680" fill="#fff"/>
  <style>
    .title{font:700 22px Arial,sans-serif;fill:#24334b;text-anchor:middle}
    .lab{font:700 20px Arial,sans-serif;fill:#24334b;text-anchor:middle}
    .cell{fill:#f9fbfe;stroke:#738299;stroke-width:2}
    .sym{font:31px Arial,sans-serif;fill:#1d2a40;text-anchor:middle;dominant-baseline:middle}
    .arrow{font:700 32px Arial,sans-serif;fill:#a34f22;text-anchor:middle;dominant-baseline:middle}
    .big{font:700 34px Arial,sans-serif;fill:#65738a;text-anchor:middle}
  </style>
  <defs>
    <g id="grid"><path d="M0 0h174v174H0zM58 0v174M116 0v174M0 58h174M0 116h174" class="cell"/></g>
  </defs>

  <!-- Stem row: Example before → after | Target -->
  <text x="245" y="38" class="title">Example</text>
  <g transform="translate(65 55)"><use href="#grid"/><text x="29" y="29" class="sym">▲</text><text x="87" y="87" class="arrow">→</text><text x="145" y="145" class="sym">■</text></g>
  <text x="285" y="152" class="big">→</text>
  <g transform="translate(335 55)"><use href="#grid"/><text x="145" y="29" class="sym">■</text><text x="87" y="87" class="arrow">↑</text><text x="29" y="145" class="sym">▲</text></g>

  <text x="925" y="38" class="title">Target</text>
  <g transform="translate(838 55)"><use href="#grid"/><text x="87" y="29" class="sym">◆</text><text x="29" y="87" class="sym">●</text><text x="145" y="145" class="arrow">↓</text></g>

  <!-- Options row -->
  <text x="620" y="290" class="title">Options</text>
  <text x="180" y="325" class="lab">A</text>
  <g transform="translate(93 340)"><use href="#grid"/><text x="87" y="29" class="sym">●</text><text x="145" y="87" class="sym">◆</text><text x="29" y="145" class="arrow">←</text></g>
  <text x="460" y="325" class="lab">B</text>
  <g transform="translate(373 340)"><use href="#grid"/><text x="145" y="29" class="arrow">→</text><text x="29" y="87" class="sym">◆</text><text x="87" y="145" class="sym">●</text></g>
  <text x="740" y="325" class="lab">C</text>
  <g transform="translate(653 340)"><use href="#grid"/><text x="145" y="29" class="arrow">↓</text><text x="29" y="87" class="sym">◆</text><text x="87" y="145" class="sym">●</text></g>
  <text x="1020" y="325" class="lab">D</text>
  <g transform="translate(933 340)"><use href="#grid"/><text x="87" y="29" class="sym">◆</text><text x="145" y="87" class="sym">●</text><text x="29" y="145" class="arrow">↓</text></g>
</svg>
