<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">Room operation examples and recorded crate states</title>
  <desc id="desc">Room A changes inside diamond, clipped circle, and A-loose star to inside star, clipped diamond, and A-loose circle. Room B changes inside diamond, clipped circle, and B-loose star to inside circle, clipped star, and B-loose diamond. Room C exchanges inside diamond and clipped circle, producing inside circle and clipped diamond. Initial state: inside star, clipped hollow circle, A-loose triangle, B-loose square. Final state: inside triangle, clipped star, A-loose square, B-loose hollow circle.</desc>
  <style>.head{font:700 27px sans-serif;fill:#243a57;text-anchor:middle}.room{font:700 28px sans-serif;fill:#174a78;text-anchor:middle}.state{font:700 21px sans-serif;fill:#526a84;text-anchor:middle}.role{font:700 17px sans-serif;fill:#526a84;text-anchor:middle}.cell{stroke:#263b58;stroke-width:3}.inside{fill:#eef5fb}.clipped{fill:#fff4e9}.loose{fill:#f4f1f8}.none{fill:#f7f7f7;stroke-dasharray:7 6}.mark{fill:#152e4e}.hollow{fill:#fff;stroke:#152e4e;stroke-width:3}.arrow{fill:none;stroke:#d26928;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.note{font:700 16px sans-serif;fill:#748399;text-anchor:middle}.divider{stroke:#d8e0e6;stroke-width:2}</style>
  <defs><g id="tri"><path class="mark" d="M0-26L25 21H-25Z"/></g><g id="square"><rect class="mark" x="-21" y="-21" width="42" height="42" rx="2"/></g><g id="circle"><circle class="mark" r="22"/></g><g id="hcircle"><circle class="hollow" r="22"/></g><g id="diamond"><path class="mark" d="M0-26L26 0 0 26-26 0Z"/></g><g id="star"><path class="mark" d="M0-29L7-9 28-9 11 4 17 25 0 13-17 25-11 4-28-9-7-9Z"/></g></defs>
  <rect width="1200" height="1120" fill="#fff"/><text class="head" x="600" y="40">HOW EACH ROOM CHANGES THE ITEMS</text>
  <text class="room" x="70" y="148">ROOM A</text><text class="state" x="340" y="82">BEFORE</text><text class="role" x="205" y="113">INSIDE</text><text class="role" x="340" y="113">CLIPPED</text><text class="role" x="475" y="113">A LOOSE</text>
  <rect class="cell inside" x="145" y="128" width="120" height="96" rx="8"/><rect class="cell clipped" x="280" y="128" width="120" height="96" rx="8"/><rect class="cell loose" x="415" y="128" width="120" height="96" rx="8"/><use href="#diamond" transform="translate(205 176)"/><use href="#circle" transform="translate(340 176)"/><use href="#star" transform="translate(475 176)"/><path class="arrow" d="M555 176H625M625 176l-20-14M625 176l-20 14"/>
  <text class="state" x="860" y="82">AFTER</text><text class="role" x="725" y="113">INSIDE</text><text class="role" x="860" y="113">CLIPPED</text><text class="role" x="995" y="113">A LOOSE</text><rect class="cell inside" x="665" y="128" width="120" height="96" rx="8"/><rect class="cell clipped" x="800" y="128" width="120" height="96" rx="8"/><rect class="cell loose" x="935" y="128" width="120" height="96" rx="8"/><use href="#star" transform="translate(725 176)"/><use href="#diamond" transform="translate(860 176)"/><use href="#circle" transform="translate(995 176)"/>
  <text class="room" x="70" y="378">ROOM B</text><text class="state" x="340" y="312">BEFORE</text><text class="role" x="205" y="343">INSIDE</text><text class="role" x="340" y="343">CLIPPED</text><text class="role" x="475" y="343">B LOOSE</text>
  <rect class="cell inside" x="145" y="358" width="120" height="96" rx="8"/><rect class="cell clipped" x="280" y="358" width="120" height="96" rx="8"/><rect class="cell loose" x="415" y="358" width="120" height="96" rx="8"/><use href="#diamond" transform="translate(205 406)"/><use href="#circle" transform="translate(340 406)"/><use href="#star" transform="translate(475 406)"/><path class="arrow" d="M555 406H625M625 406l-20-14M625 406l-20 14"/>
  <text class="state" x="860" y="312">AFTER</text><text class="role" x="725" y="343">INSIDE</text><text class="role" x="860" y="343">CLIPPED</text><text class="role" x="995" y="343">B LOOSE</text><rect class="cell inside" x="665" y="358" width="120" height="96" rx="8"/><rect class="cell clipped" x="800" y="358" width="120" height="96" rx="8"/><rect class="cell loose" x="935" y="358" width="120" height="96" rx="8"/><use href="#circle" transform="translate(725 406)"/><use href="#star" transform="translate(860 406)"/><use href="#diamond" transform="translate(995 406)"/>
  <text class="room" x="70" y="608">ROOM C</text><text class="state" x="340" y="542">BEFORE</text><text class="role" x="205" y="573">INSIDE</text><text class="role" x="340" y="573">CLIPPED</text><text class="role" x="475" y="573">NO LOOSE ITEM</text>
  <rect class="cell inside" x="145" y="588" width="120" height="96" rx="8"/><rect class="cell clipped" x="280" y="588" width="120" height="96" rx="8"/><rect class="cell none" x="415" y="588" width="120" height="96" rx="8"/><use href="#diamond" transform="translate(205 636)"/><use href="#circle" transform="translate(340 636)"/><text class="note" x="475" y="641">NONE</text><path class="arrow" d="M555 636H625M625 636l-20-14M625 636l-20 14"/>
  <text class="state" x="860" y="542">AFTER</text><text class="role" x="725" y="573">INSIDE</text><text class="role" x="860" y="573">CLIPPED</text><text class="role" x="995" y="573">NO LOOSE ITEM</text><rect class="cell inside" x="665" y="588" width="120" height="96" rx="8"/><rect class="cell clipped" x="800" y="588" width="120" height="96" rx="8"/><rect class="cell none" x="935" y="588" width="120" height="96" rx="8"/><use href="#circle" transform="translate(725 636)"/><use href="#diamond" transform="translate(860 636)"/><text class="note" x="995" y="641">NONE</text>
  <line class="divider" x1="55" y1="748" x2="1145" y2="748"/><text class="head" x="600" y="796">RECORDED STATES</text>
  <text class="state" x="300" y="837">INITIAL</text><text class="role" x="120" y="870">INSIDE</text><text class="role" x="240" y="870">CLIPPED</text><text class="role" x="360" y="870">A LOOSE</text><text class="role" x="480" y="870">B LOOSE</text><rect class="cell inside" x="65" y="885" width="110" height="96" rx="8"/><rect class="cell clipped" x="185" y="885" width="110" height="96" rx="8"/><rect class="cell loose" x="305" y="885" width="110" height="96" rx="8"/><rect class="cell loose" x="425" y="885" width="110" height="96" rx="8"/><use href="#star" transform="translate(120 933)"/><use href="#hcircle" transform="translate(240 933)"/><use href="#tri" transform="translate(360 933)"/><use href="#square" transform="translate(480 933)"/><path class="arrow" d="M555 933H625M625 933l-20-14M625 933l-20 14"/>
  <text class="state" x="900" y="837">FINAL</text><text class="role" x="720" y="870">INSIDE</text><text class="role" x="840" y="870">CLIPPED</text><text class="role" x="960" y="870">A LOOSE</text><text class="role" x="1080" y="870">B LOOSE</text><rect class="cell inside" x="665" y="885" width="110" height="96" rx="8"/><rect class="cell clipped" x="785" y="885" width="110" height="96" rx="8"/><rect class="cell loose" x="905" y="885" width="110" height="96" rx="8"/><rect class="cell loose" x="1025" y="885" width="110" height="96" rx="8"/><use href="#tri" transform="translate(720 933)"/><use href="#star" transform="translate(840 933)"/><use href="#square" transform="translate(960 933)"/><use href="#hcircle" transform="translate(1080 933)"/>
</svg>
