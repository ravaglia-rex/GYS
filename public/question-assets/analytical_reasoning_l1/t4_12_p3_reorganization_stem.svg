<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1370" viewBox="0 0 1200 1370" role="img" aria-labelledby="title desc">
  <title id="title">Two company reorganization examples and one target chart</title>
  <desc id="desc">Example 1: before, H with lowest badge leads J with middle badge, who is marked PROMOTE and manages R highest and S lowest, and K highest manages T lowest and U middle. After, J leads; R manages S, K manages U, and H manages T. Example 2: before, Q highest leads R lowest, who manages V middle and W highest, and S middle is marked PROMOTE and manages X lowest and Y highest. After, S leads; Y manages X, R manages V, and Q manages W. Target: M middle leads N lowest, marked PROMOTE, who manages A highest and B middle, and P highest manages C middle and D lowest.</desc>
  <style>
    .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#b8c5d0;stroke-width:2}.node{fill:#fff;stroke:#253b4d;stroke-width:2.2}.promoted{fill:#fff3d9;stroke:#a86200;stroke-width:3}.edge{fill:none;stroke:#526b7b;stroke-width:2.4;stroke-linejoin:round}.section{font:700 24px sans-serif;fill:#174a78}.heading{font:700 21px sans-serif;fill:#3b5060;text-anchor:middle}.person{font:700 19px "DejaVu Sans",sans-serif;fill:#173f63;text-anchor:middle;dominant-baseline:middle}.tag{font:700 14px sans-serif;fill:#8b5000;text-anchor:middle}.arrow{font:700 34px sans-serif;fill:#526572;text-anchor:middle}.rank{font:700 18px "DejaVu Sans",sans-serif;fill:#425869}.rule{stroke:#d8e0e6;stroke-width:2}
  </style>
  <rect class="bg" width="1200" height="1370"/>
  <text class="rank" x="30" y="34">BADGE RANK: ◆ highest   ▲ middle   ● lowest</text>

  <!-- Example 1 -->
  <text class="section" x="30" y="78">EXAMPLE 1</text>
  <rect class="panel" x="30" y="96" width="520" height="350" rx="12"/><rect class="panel" x="650" y="96" width="520" height="350" rx="12"/>
  <text class="heading" x="290" y="128">BEFORE</text><text class="heading" x="910" y="128">AFTER</text><text class="arrow" x="600" y="285">→</text>
  <path class="edge" d="M290 189V214H175V239M290 214H405V239M175 281V309H112V334M175 309H238V334M405 281V309H342V334M405 309H468V334"/>
  <rect class="node" x="245" y="147" width="90" height="42" rx="21"/><text class="person" x="290" y="169">H ●</text>
  <rect class="promoted" x="130" y="239" width="90" height="42" rx="21"/><text class="person" x="175" y="261">J ▲</text><text class="tag" x="175" y="302">PROMOTE</text>
  <rect class="node" x="360" y="239" width="90" height="42" rx="21"/><text class="person" x="405" y="261">K ◆</text>
  <rect class="node" x="67" y="334" width="90" height="42" rx="21"/><text class="person" x="112" y="356">R ◆</text><rect class="node" x="193" y="334" width="90" height="42" rx="21"/><text class="person" x="238" y="356">S ●</text>
  <rect class="node" x="297" y="334" width="90" height="42" rx="21"/><text class="person" x="342" y="356">T ●</text><rect class="node" x="423" y="334" width="90" height="42" rx="21"/><text class="person" x="468" y="356">U ▲</text>
  <path class="edge" d="M910 189V214H735V239M910 214V239M910 214H1085V239M735 281V334M910 281V334M1085 281V334"/>
  <rect class="node" x="865" y="147" width="90" height="42" rx="21"/><text class="person" x="910" y="169">J ▲</text>
  <rect class="node" x="690" y="239" width="90" height="42" rx="21"/><text class="person" x="735" y="261">R ◆</text><rect class="node" x="865" y="239" width="90" height="42" rx="21"/><text class="person" x="910" y="261">K ◆</text><rect class="node" x="1040" y="239" width="90" height="42" rx="21"/><text class="person" x="1085" y="261">H ●</text>
  <rect class="node" x="690" y="334" width="90" height="42" rx="21"/><text class="person" x="735" y="356">S ●</text><rect class="node" x="865" y="334" width="90" height="42" rx="21"/><text class="person" x="910" y="356">U ▲</text><rect class="node" x="1040" y="334" width="90" height="42" rx="21"/><text class="person" x="1085" y="356">T ●</text>

  <!-- Example 2 -->
  <text class="section" x="30" y="508">EXAMPLE 2</text>
  <rect class="panel" x="30" y="526" width="520" height="350" rx="12"/><rect class="panel" x="650" y="526" width="520" height="350" rx="12"/>
  <text class="heading" x="290" y="558">BEFORE</text><text class="heading" x="910" y="558">AFTER</text><text class="arrow" x="600" y="715">→</text>
  <path class="edge" d="M290 619V644H175V669M290 644H405V669M175 711V739H112V764M175 739H238V764M405 711V739H342V764M405 739H468V764"/>
  <rect class="node" x="245" y="577" width="90" height="42" rx="21"/><text class="person" x="290" y="599">Q ◆</text>
  <rect class="node" x="130" y="669" width="90" height="42" rx="21"/><text class="person" x="175" y="691">R ●</text>
  <rect class="promoted" x="360" y="669" width="90" height="42" rx="21"/><text class="person" x="405" y="691">S ▲</text><text class="tag" x="405" y="732">PROMOTE</text>
  <rect class="node" x="67" y="764" width="90" height="42" rx="21"/><text class="person" x="112" y="786">V ▲</text><rect class="node" x="193" y="764" width="90" height="42" rx="21"/><text class="person" x="238" y="786">W ◆</text>
  <rect class="node" x="297" y="764" width="90" height="42" rx="21"/><text class="person" x="342" y="786">X ●</text><rect class="node" x="423" y="764" width="90" height="42" rx="21"/><text class="person" x="468" y="786">Y ◆</text>
  <path class="edge" d="M910 619V644H735V669M910 644V669M910 644H1085V669M735 711V764M910 711V764M1085 711V764"/>
  <rect class="node" x="865" y="577" width="90" height="42" rx="21"/><text class="person" x="910" y="599">S ▲</text>
  <rect class="node" x="690" y="669" width="90" height="42" rx="21"/><text class="person" x="735" y="691">Y ◆</text><rect class="node" x="865" y="669" width="90" height="42" rx="21"/><text class="person" x="910" y="691">R ●</text><rect class="node" x="1040" y="669" width="90" height="42" rx="21"/><text class="person" x="1085" y="691">Q ◆</text>
  <rect class="node" x="690" y="764" width="90" height="42" rx="21"/><text class="person" x="735" y="786">X ●</text><rect class="node" x="865" y="764" width="90" height="42" rx="21"/><text class="person" x="910" y="786">V ▲</text><rect class="node" x="1040" y="764" width="90" height="42" rx="21"/><text class="person" x="1085" y="786">W ◆</text>

  <!-- Target -->
  <line class="rule" x1="30" y1="920" x2="1170" y2="920"/><text class="section" x="30" y="970">TARGET — BEFORE</text>
  <rect class="panel" x="340" y="990" width="520" height="340" rx="12"/>
  <path class="edge" d="M600 1083V1108H485V1133M600 1108H715V1133M485 1175V1203H422V1228M485 1203H548V1228M715 1175V1203H652V1228M715 1203H778V1228"/>
  <rect class="node" x="555" y="1041" width="90" height="42" rx="21"/><text class="person" x="600" y="1063">M ▲</text>
  <rect class="promoted" x="440" y="1133" width="90" height="42" rx="21"/><text class="person" x="485" y="1155">N ●</text><text class="tag" x="485" y="1196">PROMOTE</text>
  <rect class="node" x="670" y="1133" width="90" height="42" rx="21"/><text class="person" x="715" y="1155">P ◆</text>
  <rect class="node" x="377" y="1228" width="90" height="42" rx="21"/><text class="person" x="422" y="1250">A ◆</text><rect class="node" x="503" y="1228" width="90" height="42" rx="21"/><text class="person" x="548" y="1250">B ▲</text>
  <rect class="node" x="607" y="1228" width="90" height="42" rx="21"/><text class="person" x="652" y="1250">C ▲</text><rect class="node" x="733" y="1228" width="90" height="42" rx="21"/><text class="person" x="778" y="1250">D ●</text>
</svg>
