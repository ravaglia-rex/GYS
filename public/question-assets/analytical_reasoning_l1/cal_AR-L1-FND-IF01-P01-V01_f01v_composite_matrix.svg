  <line x1="45" y1="370" x2="715" y2="370" stroke="#d6deea" stroke-width="2"/>
  <text x="380" y="405" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#243247">Options</text>
