  <g font-family="Arial,Helvetica,sans-serif" fill="#243247" font-size="17" font-weight="700">
    <text x="205" y="30" text-anchor="middle">Column 1</text><text x="410" y="30" text-anchor="middle">Column 2</text><text x="615" y="30" text-anchor="middle">Column 3</text>
    <text x="65" y="112" text-anchor="middle">Row 1</text><text x="65" y="212" text-anchor="middle">Row 2</text><text x="65" y="312" text-anchor="middle">Row 3</text>
  </g>
  <g fill="#f8fafc" stroke="#d6deea" stroke-width="2">
    <rect x="150" y="55" width="110" height="80" rx="11"/><rect x="355" y="55" width="110" height="80" rx="11"/><rect x="560" y="55" width="110" height="80" rx="11"/>
    <rect x="150" y="155" width="110" height="80" rx="11"/><rect x="355" y="155" width="110" height="80" rx="11"/><rect x="560" y="155" width="110" height="80" rx="11"/>
    <rect x="150" y="255" width="110" height="80" rx="11"/><rect x="355" y="255" width="110" height="80" rx="11"/><rect x="560" y="255" width="110" height="80" rx="11"/>
  </g>
  <g fill="none" stroke="#243247" stroke-width="4" stroke-linejoin="round">
    <rect x="176" y="66" width="58" height="58"/><rect x="381" y="66" width="58" height="58"/><rect x="586" y="66" width="58" height="58"/>
    <circle cx="205" cy="195" r="30"/><circle cx="615" cy="195" r="30"/>
    <polygon points="205,266 174,322 236,322"/><polygon points="410,266 379,322 441,322"/><polygon points="615,266 584,322 646,322"/>
  </g>
  <g fill="#243247">
    <path d="M205 85l3 7h8l-6 5 2 8-7-5-7 5 2-8-6-5h8z"/><polygon points="410,86 419,95 410,104 401,95"/><circle cx="615" cy="95" r="8"/>
    <path d="M205 185l3 7h8l-6 5 2 8-7-5-7 5 2-8-6-5h8z"/><circle cx="615" cy="195" r="8"/>
    <path d="M205 285l3 7h8l-6 5 2 8-7-5-7 5 2-8-6-5h8z"/><polygon points="410,286 419,295 410,304 401,295"/><circle cx="615" cy="295" r="8"/>
  </g>
