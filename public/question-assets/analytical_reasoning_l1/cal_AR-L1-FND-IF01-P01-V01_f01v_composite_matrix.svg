<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
  <title id="title">Composite-card matrix</title>
  <desc id="desc">Rows keep one large hollow outer shape and columns keep one much smaller solid inner symbol. The center card is missing.</desc>
