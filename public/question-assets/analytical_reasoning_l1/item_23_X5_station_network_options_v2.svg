<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Four possible research station corridor diagrams</title>
  <desc id="desc">Four diagrams labelled A through D have the same six-node branching corridor network but different assignments of Command, Laboratory, Medbay, Observatory, Greenhouse, and Tool Room.</desc>
  <style>
    .panel { fill: #f7f9fc; stroke: #95a2b4; stroke-width: 2; }
    .edge { stroke: #4a586b; stroke-width: 7; stroke-linecap: round; }
    .node { fill: #e0efff; stroke: #346a9e; stroke-width: 2.5; }
    .label { font: 700 22px system-ui, sans-serif; fill: #162235; text-anchor: middle; dominant-baseline: central; }
    .option { font: 700 24px system-ui, sans-serif; fill: #162235; }
  </style>

  <g transform="translate(40,40)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">A</text>
    <g transform="translate(50,35)">
      <path d="M30 75H120 M120 75H210 M210 75H300 M210 75V135 H300" class="edge" fill="none"/>
      <g class="node"><circle cx="210" cy="75" r="24"/><circle cx="120" cy="75" r="24"/><circle cx="300" cy="75" r="24"/><circle cx="210" cy="135" r="24"/><circle cx="30" cy="75" r="24"/><circle cx="300" cy="135" r="24"/></g>
      <g class="label"><text x="210" y="75">T</text><text x="120" y="75">L</text><text x="300" y="75">M</text><text x="210" y="135">O</text><text x="30" y="75">C</text><text x="300" y="135">G</text></g>
    </g>
  </g>

  <g transform="translate(480,40)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">B</text>
    <g transform="translate(50,35)">
      <path d="M30 75H120 M120 75H210 M210 75H300 M210 75V135 H300" class="edge" fill="none"/>
      <g class="node"><circle cx="210" cy="75" r="24"/><circle cx="120" cy="75" r="24"/><circle cx="300" cy="75" r="24"/><circle cx="210" cy="135" r="24"/><circle cx="30" cy="75" r="24"/><circle cx="300" cy="135" r="24"/></g>
      <g class="label"><text x="210" y="75">T</text><text x="120" y="75">C</text><text x="300" y="75">L</text><text x="210" y="135">O</text><text x="30" y="75">G</text><text x="300" y="135">M</text></g>
    </g>
  </g>

  <g transform="translate(40,280)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">C</text>
    <g transform="translate(50,35)">
      <path d="M30 75H120 M120 75H210 M210 75H300 M210 75V135 H300" class="edge" fill="none"/>
      <g class="node"><circle cx="210" cy="75" r="24"/><circle cx="120" cy="75" r="24"/><circle cx="300" cy="75" r="24"/><circle cx="210" cy="135" r="24"/><circle cx="30" cy="75" r="24"/><circle cx="300" cy="135" r="24"/></g>
      <g class="label"><text x="210" y="75">T</text><text x="120" y="75">M</text><text x="300" y="75">L</text><text x="210" y="135">O</text><text x="30" y="75">C</text><text x="300" y="135">G</text></g>
    </g>
  </g>

  <g transform="translate(480,280)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">D</text>
    <g transform="translate(50,35)">
      <path d="M30 75H120 M120 75H210 M210 75H300 M210 75V135 H300" class="edge" fill="none"/>
      <g class="node"><circle cx="210" cy="75" r="24"/><circle cx="120" cy="75" r="24"/><circle cx="300" cy="75" r="24"/><circle cx="210" cy="135" r="24"/><circle cx="30" cy="75" r="24"/><circle cx="300" cy="135" r="24"/></g>
      <g class="label"><text x="210" y="75">G</text><text x="120" y="75">M</text><text x="300" y="75">L</text><text x="210" y="135">O</text><text x="30" y="75">C</text><text x="300" y="135">T</text></g>
    </g>
  </g>
</svg>
