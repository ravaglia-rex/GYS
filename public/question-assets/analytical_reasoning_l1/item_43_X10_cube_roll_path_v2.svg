<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
  <title id="title">Five-roll path for a cube</title>
  <desc id="desc">North is toward the top of the page. From START, the cube rolls one square east, two squares north, one square west, and one square south to END. Only the five route steps have arrows.</desc>
  <defs>
    <marker id="routeArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 L10,5 z" fill="#6b4eff"/>
    </marker>
  </defs>
  <style>
    .cell{fill:#f7f8fc;stroke:#344054;stroke-width:3}
    .step{font:700 22px system-ui,sans-serif;fill:#182230;text-anchor:middle;dominant-baseline:central}
    .north{font:700 21px system-ui,sans-serif;fill:#475467;text-anchor:middle}
    .path{fill:none;stroke:#6b4eff;stroke-width:5;stroke-linecap:round;marker-end:url(#routeArrow)}
  </style>

  <text x="380" y="32" class="north">NORTH IS TOWARD THE TOP OF THE PAGE</text>

  <g transform="translate(235 60)">
    <rect x="0" y="0" width="110" height="90" rx="8" class="cell"/>
    <rect x="180" y="0" width="110" height="90" rx="8" class="cell"/>
    <rect x="0" y="150" width="110" height="90" rx="8" class="cell"/>
    <rect x="180" y="150" width="110" height="90" rx="8" class="cell"/>
    <rect x="0" y="300" width="110" height="90" rx="8" class="cell"/>
    <rect x="180" y="300" width="110" height="90" rx="8" class="cell"/>

    <text x="55" y="45" class="step">4</text>
    <text x="235" y="45" class="step">3</text>
    <text x="55" y="185" class="step"><tspan x="55">5</tspan><tspan x="55" dy="25">END</tspan></text>
    <text x="235" y="195" class="step">2</text>
    <text x="55" y="345" class="step">START</text>
    <text x="235" y="345" class="step">1</text>

    <path d="M118 345 L172 345" class="path"/>
    <path d="M235 292 L235 248" class="path"/>
    <path d="M235 142 L235 98" class="path"/>
    <path d="M172 45 L118 45" class="path"/>
    <path d="M55 98 L55 142" class="path"/>
  </g>

  <text x="380" y="510" class="north">Roll east → north → north → west → south</text>
</svg>
