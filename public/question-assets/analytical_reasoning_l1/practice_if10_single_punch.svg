<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" role="img" aria-labelledby="title desc">
  <title id="title">One fold, one punch, and four possible unfolded sheets</title>
  <desc id="desc">A two-row by four-column sheet folds at the vertical middle line, with the right half folding left. A hole is punched at the upper-left of the folded two-by-two sheet. Four unfolded hole patterns follow.</desc>
  <style>.sheet{fill:#fff;stroke:#263b53;stroke-width:3}.grid{stroke:#9aa8b7;stroke-width:2}.fold{stroke:#4f8ab5;stroke-width:4;stroke-dasharray:10 8}.hole{fill:#17283e}.cap{font:600 18px Arial,sans-serif;fill:#53687d;text-anchor:middle}</style>
  <rect width="980" height="440" fill="#fff"/>
  <text class="cap" x="260" y="32">FOLD THE RIGHT HALF LEFT</text>
  <g transform="translate(60 55)"><rect class="sheet" width="400" height="200"/><path class="grid" d="M100 0V200M200 0V200M300 0V200M0 100H400"/><line class="fold" x1="200" y1="0" x2="200" y2="200"/></g>
  <text class="cap" x="650" y="32">PUNCH THE MARKED POSITION</text>
  <g transform="translate(550 55)"><rect class="sheet" width="200" height="200"/><path class="grid" d="M100 0V200M0 100H200"/><circle class="hole" cx="50" cy="50" r="15"/></g>
  <g transform="translate(35 290) scale(.42)"><rect class="sheet" width="400" height="200"/><path class="grid" d="M100 0V200M200 0V200M300 0V200M0 100H400"/><circle class="hole" cx="50" cy="50" r="15"/><circle class="hole" cx="350" cy="50" r="15"/></g>
  <g transform="translate(275 290) scale(.42)"><rect class="sheet" width="400" height="200"/><path class="grid" d="M100 0V200M200 0V200M300 0V200M0 100H400"/><circle class="hole" cx="150" cy="50" r="15"/><circle class="hole" cx="250" cy="50" r="15"/></g>
  <g transform="translate(515 290) scale(.42)"><rect class="sheet" width="400" height="200"/><path class="grid" d="M100 0V200M200 0V200M300 0V200M0 100H400"/><circle class="hole" cx="50" cy="50" r="15"/><circle class="hole" cx="350" cy="150" r="15"/></g>
  <g transform="translate(755 290) scale(.42)"><rect class="sheet" width="400" height="200"/><path class="grid" d="M100 0V200M200 0V200M300 0V200M0 100H400"/><circle class="hole" cx="50" cy="50" r="15"/></g>
</svg>
