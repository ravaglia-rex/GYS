<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Four possible two-by-four arrangements of eight labelled pieces</title>
  <desc id="desc">Option A is A C Z X over E G Q T. Option B is A Z C X over E G Q T. Option C is A Z C X over E Q G T. Option D is A Z X C over E Q T G.</desc>
  <style>
    .panel { fill:#f8fafc; stroke:#cbd6e2; stroke-width:3; }
    .piece { fill:#fff; stroke:#263d5b; stroke-width:3; }
    .letter { font:700 25px sans-serif; fill:#263d5b; text-anchor:middle; dominant-baseline:middle; }
    .option { font:700 30px sans-serif; fill:#263d5b; }
    .fixed { fill:#e8f2ff; }
  </style>
  <rect width="980" height="560" fill="#fff"/>

  <g transform="translate(25 25)"><rect class="panel" width="450" height="245" rx="14"/><text class="option" x="20" y="42">A</text>
    <g transform="translate(50 65)">
      <rect class="piece fixed" x="0" y="0" width="82" height="72"/><rect class="piece" x="82" y="0" width="82" height="72"/><rect class="piece" x="164" y="0" width="82" height="72"/><rect class="piece" x="246" y="0" width="82" height="72"/>
      <rect class="piece" x="0" y="72" width="82" height="72"/><rect class="piece" x="82" y="72" width="82" height="72"/><rect class="piece" x="164" y="72" width="82" height="72"/><rect class="piece" x="246" y="72" width="82" height="72"/>
      <text class="letter" x="41" y="36">A</text><text class="letter" x="123" y="36">C</text><text class="letter" x="205" y="36">Z</text><text class="letter" x="287" y="36">X</text>
      <text class="letter" x="41" y="108">E</text><text class="letter" x="123" y="108">G</text><text class="letter" x="205" y="108">Q</text><text class="letter" x="287" y="108">T</text>
    </g>
  </g>

  <g transform="translate(505 25)"><rect class="panel" width="450" height="245" rx="14"/><text class="option" x="20" y="42">B</text>
    <g transform="translate(50 65)">
      <rect class="piece fixed" x="0" y="0" width="82" height="72"/><rect class="piece" x="82" y="0" width="82" height="72"/><rect class="piece" x="164" y="0" width="82" height="72"/><rect class="piece" x="246" y="0" width="82" height="72"/>
      <rect class="piece" x="0" y="72" width="82" height="72"/><rect class="piece" x="82" y="72" width="82" height="72"/><rect class="piece" x="164" y="72" width="82" height="72"/><rect class="piece" x="246" y="72" width="82" height="72"/>
      <text class="letter" x="41" y="36">A</text><text class="letter" x="123" y="36">Z</text><text class="letter" x="205" y="36">C</text><text class="letter" x="287" y="36">X</text>
      <text class="letter" x="41" y="108">E</text><text class="letter" x="123" y="108">G</text><text class="letter" x="205" y="108">Q</text><text class="letter" x="287" y="108">T</text>
    </g>
  </g>

  <g transform="translate(25 295)"><rect class="panel" width="450" height="245" rx="14"/><text class="option" x="20" y="42">C</text>
    <g transform="translate(50 65)">
      <rect class="piece fixed" x="0" y="0" width="82" height="72"/><rect class="piece" x="82" y="0" width="82" height="72"/><rect class="piece" x="164" y="0" width="82" height="72"/><rect class="piece" x="246" y="0" width="82" height="72"/>
      <rect class="piece" x="0" y="72" width="82" height="72"/><rect class="piece" x="82" y="72" width="82" height="72"/><rect class="piece" x="164" y="72" width="82" height="72"/><rect class="piece" x="246" y="72" width="82" height="72"/>
      <text class="letter" x="41" y="36">A</text><text class="letter" x="123" y="36">Z</text><text class="letter" x="205" y="36">C</text><text class="letter" x="287" y="36">X</text>
      <text class="letter" x="41" y="108">E</text><text class="letter" x="123" y="108">Q</text><text class="letter" x="205" y="108">G</text><text class="letter" x="287" y="108">T</text>
    </g>
  </g>

  <g transform="translate(505 295)"><rect class="panel" width="450" height="245" rx="14"/><text class="option" x="20" y="42">D</text>
    <g transform="translate(50 65)">
      <rect class="piece fixed" x="0" y="0" width="82" height="72"/><rect class="piece" x="82" y="0" width="82" height="72"/><rect class="piece" x="164" y="0" width="82" height="72"/><rect class="piece" x="246" y="0" width="82" height="72"/>
      <rect class="piece" x="0" y="72" width="82" height="72"/><rect class="piece" x="82" y="72" width="82" height="72"/><rect class="piece" x="164" y="72" width="82" height="72"/><rect class="piece" x="246" y="72" width="82" height="72"/>
      <text class="letter" x="41" y="36">A</text><text class="letter" x="123" y="36">Z</text><text class="letter" x="205" y="36">X</text><text class="letter" x="287" y="36">C</text>
      <text class="letter" x="41" y="108">E</text><text class="letter" x="123" y="108">Q</text><text class="letter" x="205" y="108">T</text><text class="letter" x="287" y="108">G</text>
    </g>
  </g>
</svg>
