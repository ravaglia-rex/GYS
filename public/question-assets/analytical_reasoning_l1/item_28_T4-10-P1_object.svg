<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Four labelled blocks positioned in a cube-shaped frame</title>
  <desc id="desc">At the lower level, the square block is directly east of the triangle block and the circle block is directly north of the square block. The diamond block is directly above the circle block.</desc>
  <style>
    .frame { fill: none; stroke: #8aa0b2; stroke-width: 2.5; }
    .hidden { fill: none; stroke: #a9b6c1; stroke-width: 2; stroke-dasharray: 6 6; }
    .edge { stroke: #263746; stroke-width: 2.5; stroke-linejoin: round; }
    .top { fill: #eef5fa; }
    .left { fill: #dce9f2; }
    .right { fill: #c9dce9; }
    .block-symbol { font: 700 25px "DejaVu Sans", sans-serif; fill: #173f63; text-anchor: middle; dominant-baseline: middle; }
    .axis { fill: none; stroke: #174a78; stroke-width: 3; marker-end: url(#arrow); }
    .axis-label { font: 700 17px sans-serif; fill: #174a78; }
    .caption { font: 17px sans-serif; fill: #2d3a45; }
    .view-label { font: 700 16px sans-serif; fill: #333; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#174a78"/>
    </marker>
    <g id="cube">
      <path class="top edge" d="M0,-24 L42,0 L0,24 L-42,0 Z"/>
      <path class="right edge" d="M42,0 L0,24 L0,72 L42,48 Z"/>
      <path class="left edge" d="M-42,0 L0,24 L0,72 L-42,48 Z"/>
    </g>
  </defs>
  <rect width="920" height="500" fill="#fff"/>

  <!-- Faint two-by-two ground frame and vertical extent. -->
  <path class="frame" d="M278 250L362 202L446 250L362 298Z"/>
  <path class="hidden" d="M320 226L404 274M404 226L320 274"/>
  <path class="hidden" d="M446 250V154M362 202V106M278 250V154M362 298V202"/>
  <path class="hidden" d="M278 154L362 106L446 154L362 202Z"/>

  <!-- Lower chain: triangle southwest, square southeast, circle northeast. -->
  <g transform="translate(320 250)"><use href="#cube"/><text class="block-symbol" x="0" y="3">▲</text></g>
  <g transform="translate(362 274)"><use href="#cube"/><text class="block-symbol" x="-20" y="47">■</text></g>
  <g transform="translate(404 250)"><use href="#cube"/><text class="block-symbol" x="21" y="50">●</text></g>

  <!-- Upper diamond block stacked directly above the circle. -->
  <g transform="translate(404 202)"><use href="#cube"/><text class="block-symbol" x="0" y="3">◆</text></g>

  <!-- Direction triad. -->
  <path class="axis" d="M610 326L700 274"/><text class="axis-label" x="712" y="278">NORTH</text>
  <path class="axis" d="M610 326V218"/><text class="axis-label" x="622" y="222">UP</text>

  <!-- Viewpoint reminders. -->
  <circle cx="530" cy="76" r="18" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <path d="M530 96V122M514 109H546" stroke="#333" stroke-width="2.5"/>
  <path class="axis" d="M530 132V173"/>
  <text class="view-label" x="530" y="52">TOP OBSERVER</text>

  <circle cx="835" cy="445" r="18" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <path d="M835 465V491M819 478H851" stroke="#333" stroke-width="2.5"/>
  <path class="axis" d="M810 430L752 397"/>
  <text class="view-label" x="835" y="410">EAST OBSERVER</text>
</svg>
