<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Four possible final Forge and Archive states</title><desc id="desc">Four final-state choices. The correct state has diamond loose in Forge, square inside, triangle clipped, and hollow circle loose in Archive.</desc>
  <style>
    .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#b8c5d0;stroke-width:2}.heading{font:700 25px sans-serif;fill:#243a57;text-anchor:middle}.section{font:700 24px sans-serif;fill:#174a78}.sub{font:700 19px sans-serif;fill:#3b5060;text-anchor:middle}.role{font:700 16px sans-serif;fill:#526a84;text-anchor:middle}.cell{stroke:#263b58;stroke-width:2.5}.inside{fill:#eef5fb}.clipped{fill:#fff4e9}.loose{fill:#f4f1f8}.arrow{fill:none;stroke:#d26928;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.route{font:700 22px sans-serif;fill:#8f4f17;text-anchor:middle}.divider{stroke:#d8e0e6;stroke-width:2}.edge{fill:none;stroke:#526b7b;stroke-width:2.4;stroke-linejoin:round}.node{fill:#fff;stroke:#253b4d;stroke-width:2.2}.promoted{fill:#fff3d9;stroke:#a86200;stroke-width:3}.person{font:700 19px sans-serif;fill:#173f63;text-anchor:middle;dominant-baseline:middle}.tag{font:700 13px sans-serif;fill:#8b5000;text-anchor:middle}.mark-solid{fill:#173f63;stroke:#173f63;stroke-width:3}.mark-hollow{fill:#fff;stroke:#173f63;stroke-width:3}
  </style>

  <defs>
    <g id="tri_s"><path class="mark-solid" d="M0-24L23 20H-23Z"/></g>
    <g id="tri_h"><path class="mark-hollow" d="M0-24L23 20H-23Z"/></g>
    <g id="square_s"><rect class="mark-solid" x="-20" y="-20" width="40" height="40" rx="2"/></g>
    <g id="circle_s"><circle class="mark-solid" r="21"/></g>
    <g id="circle_h"><circle class="mark-hollow" r="21"/></g>
    <g id="diamond_s"><path class="mark-solid" d="M0-24L24 0 0 24-24 0Z"/></g>
    <g id="star_s"><path class="mark-solid" d="M0-25L6-8 24-8 10 3 15 21 0 11-15 21-10 3-24-8-6-8Z"/></g>
  </defs>
<rect class="bg" width="1200" height="720"/><g transform="translate(25 25)"><rect class="panel" width="560" height="320" rx="12"/><text class="role" x="85.5" y="93"><tspan x="85.5">FORGE</tspan><tspan x="85.5" dy="17">LOOSE</tspan></text><rect class="cell loose" x="28" y="120" width="115" height="92" rx="8"/><use href="#diamond_s" transform="translate(85.5 168) scale(1.0)"/><text class="role" x="215.5" y="106">INSIDE</text><rect class="cell inside" x="158" y="120" width="115" height="92" rx="8"/><use href="#square_s" transform="translate(215.5 168) scale(1.0)"/><text class="role" x="345.5" y="106">CLIPPED</text><rect class="cell clipped" x="288" y="120" width="115" height="92" rx="8"/><use href="#tri_s" transform="translate(345.5 168) scale(1.0)"/><text class="role" x="475.5" y="93"><tspan x="475.5">ARCHIVE</tspan><tspan x="475.5" dy="17">LOOSE</tspan></text><rect class="cell loose" x="418" y="120" width="115" height="92" rx="8"/><use href="#circle_h" transform="translate(475.5 168) scale(1.0)"/></g><g transform="translate(615 25)"><rect class="panel" width="560" height="320" rx="12"/><text class="role" x="85.5" y="93"><tspan x="85.5">FORGE</tspan><tspan x="85.5" dy="17">LOOSE</tspan></text><rect class="cell loose" x="28" y="120" width="115" height="92" rx="8"/><use href="#square_s" transform="translate(85.5 168) scale(1.0)"/><text class="role" x="215.5" y="106">INSIDE</text><rect class="cell inside" x="158" y="120" width="115" height="92" rx="8"/><use href="#tri_s" transform="translate(215.5 168) scale(1.0)"/><text class="role" x="345.5" y="106">CLIPPED</text><rect class="cell clipped" x="288" y="120" width="115" height="92" rx="8"/><use href="#diamond_s" transform="translate(345.5 168) scale(1.0)"/><text class="role" x="475.5" y="93"><tspan x="475.5">ARCHIVE</tspan><tspan x="475.5" dy="17">LOOSE</tspan></text><rect class="cell loose" x="418" y="120" width="115" height="92" rx="8"/><use href="#circle_h" transform="translate(475.5 168) scale(1.0)"/></g><g transform=