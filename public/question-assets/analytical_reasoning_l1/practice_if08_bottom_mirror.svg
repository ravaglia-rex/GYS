<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="730" viewBox="0 0 1040 730" role="img" aria-labelledby="title desc">
  <title id="title">A card reflected in a mirror below it</title>
  <desc id="desc">A three-by-three card above a horizontal mirror and four possible reflected cards.</desc>
  <defs>
    <g id="card">
      <rect x="0" y="0" width="210" height="210" rx="5" fill="#fff" stroke="#596a80" stroke-width="3"/>
      <path d="M70 0V210M140 0V210M0 70H210M0 140H210" fill="none" stroke="#aab5c3" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1040" height="730" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26364d">
    <text x="50" y="48" font-size="26" font-weight="700">ORIGINAL CARD</text>
    <g transform="translate(415 70)"><use href="#card"/></g>
    <g font-family="Apple Symbols, Arial Unicode MS, sans-serif" font-size="46" text-anchor="middle">
      <text x="450" y="125">▲</text><text x="520" y="195">↑</text><text x="590" y="265">◆</text>
    </g>
    <line x1="355" y1="307" x2="685" y2="307" stroke="#3f84c5" stroke-width="8"/>
    <text x="520" y="342" font-size="21" font-weight="700" fill="#2c6da8" text-anchor="middle">MIRROR</text>

    <text x="50" y="400" font-size="26" font-weight="700">OPTIONS</text>
    <g transform="translate(50 430)"><use href="#card"/></g>
    <g transform="translate(295 430)"><use href="#card"/></g>
    <g transform="translate(540 430)"><use href="#card"/></g>
    <g transform="translate(785 430)"><use href="#card"/></g>
    <g font-size="24" font-weight="700" text-anchor="middle">
      <text x="155" y="680">A</text><text x="400" y="680">B</text><text x="645" y="680">C</text><text x="890" y="680">D</text>
    </g>
    <g font-family="Apple Symbols, Arial Unicode MS, sans-serif" font-size="43" text-anchor="middle">
      <text x="85" y="615">▲</text><text x="155" y="545">↓</text><text x="225" y="475">◆</text>
      <text x="330" y="615">▲</text><text x="400" y="545">↑</text><text x="470" y="475">◆</text>
      <text x="680" y="475">▲</text><text x="645" y="545">↑</text><text x="575" y="615">◆</text>
      <text x="960" y="615">▲</text><text x="890" y="545">↓</text><text x="820" y="475">◆</text>
    </g>
  </g>
</svg>
