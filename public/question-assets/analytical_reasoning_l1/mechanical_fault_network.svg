<svg xmlns="http://www.w3.org/2000/svg" width="760" height="590" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">Four-wheel belt network with one incorrect belt</title>
  <desc id="desc">Four wheels form a square with a diagonal from A to C. A-B, C-D, and A-C have straight belts. B-C and D-A have crossed belts.</desc>
  <defs>
    <style>
      .belt { fill:none; stroke:#53667a; stroke-width:5; stroke-linecap:round; }
      .wheel { fill:#fff; stroke:#24364b; stroke-width:4; }
      .hub { fill:#24364b; }
      .label { font:700 24px Arial, sans-serif; fill:#172638; text-anchor:middle; }
      .legend { font:600 17px Arial, sans-serif; fill:#31465d; }
    </style>
  </defs>

  <rect width="760" height="590" fill="#ffffff"/>

  <!-- Legend -->
  <g aria-label="Legend">
    <line class="belt" x1="60" y1="50" x2="145" y2="50"/>
    <line class="belt" x1="60" y1="64" x2="145" y2="64"/>
    <text class="legend" x="162" y="64">STRAIGHT BELT</text>
    <line class="belt" x1="385" y1="48" x2="470" y2="66"/>
    <line class="belt" x1="385" y1="66" x2="470" y2="48"/>
    <text class="legend" x="488" y="64">CROSSED BELT</text>
  </g>

  <!-- Belts behind wheels -->
  <g aria-label="Belts">
    <!-- A-B straight -->
    <line class="belt" x1="220" y1="142" x2="480" y2="142"/>
    <line class="belt" x1="220" y1="158" x2="480" y2="158"/>
    <!-- B-C crossed -->
    <line class="belt" x1="512" y1="190" x2="528" y2="400"/>
    <line class="belt" x1="528" y1="190" x2="512" y2="400"/>
    <!-- C-D straight -->
    <line class="belt" x1="480" y1="432" x2="220" y2="432"/>
    <line class="belt" x1="480" y1="448" x2="220" y2="448"/>
    <!-- D-A crossed -->
    <line class="belt" x1="172" y1="400" x2="188" y2="190"/>
    <line class="belt" x1="188" y1="400" x2="172" y2="190"/>
    <!-- A-C straight diagonal -->
    <line class="belt" x1="210" y1="181" x2="490" y2="409"/>
    <line class="belt" x1="200" y1="193" x2="480" y2="421"/>
  </g>

  <!-- Wheels -->
  <g aria-label="Wheels">
    <g><circle class="wheel" cx="180" cy="150" r="42"/><circle class="hub" cx="180" cy="150" r="6"/><text class="label" x="180" y="118">A</text></g>
    <g><circle class="wheel" cx="520" cy="150" r="42"/><circle class="hub" cx="520" cy="150" r="6"/><text class="label" x="520" y="118">B</text></g>
    <g><circle class="wheel" cx="520" cy="440" r="42"/><circle class="hub" cx="520" cy="440" r="6"/><text class="label" x="520" y="502">C</text></g>
    <g><circle class="wheel" cx="180" cy="440" r="42"/><circle class="hub" cx="180" cy="440" r="6"/><text class="label" x="180" y="502">D</text></g>
  </g>
</svg>
