<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">Machine composition with four answer rows</title>
  <desc id="desc">Examples for Machine K and Machine M, a target sent through K then M, and four possible output rows.</desc>
  <rect width="900" height="680" fill="#fff"/>
  <defs><g id="rowbox"><rect width="250" height="70" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/></g></defs>
  <g font-family="Arial, sans-serif" fill="#0f172a" dominant-baseline="middle">
    <g font-size="18" font-weight="700" fill="#475569"><text x="35" y="85">MACHINE K</text><text x="35" y="195">MACHINE M</text><text x="35" y="330">TARGET</text></g>
    <g transform="translate(175 50)"><use href="#rowbox"/></g><g transform="translate(600 50)"><use href="#rowbox"/></g>
    <g transform="translate(175 160)"><use href="#rowbox"/></g><g transform="translate(600 160)"><use href="#rowbox"/></g>
    <g transform="translate(175 295)"><use href="#rowbox"/></g>
    <g font-size="36" text-anchor="middle">
      <text x="225" y="85">▲</text><text x="285" y="85">○</text><text x="345" y="85">■</text><text x="405" y="85">◇</text><text x="510" y="85" font-size="28">→ K →</text><text x="650" y="85">◇</text><text x="710" y="85">■</text><text x="770" y="85">○</text><text x="830" y="85">△</text>
      <text x="225" y="195">▲</text><text x="285" y="195">○</text><text x="345" y="195">■</text><text x="405" y="195">◇</text><text x="510" y="195" font-size="28">→ M →</text><text x="650" y="195">○</text><text x="710" y="195">■</text><text x="770" y="195">◆</text><text x="830" y="195">▲</text>
      <text x="225" y="330">●</text><text x="285" y="330">□</text><text x="345" y="330">△</text><text x="405" y="330">◆</text><text x="560" y="330" font-size="28" font-weight="700">K → M → [?]</text>
    </g>
    <!-- Option cards sit close under TARGET (no large empty band). Letters enable crop detection. -->
    <g font-size="22" font-weight="700" fill="#64748b" class="option">
      <text x="60" y="445">A</text><text x="450" y="445">B</text><text x="60" y="575">C</text><text x="450" y="575">D</text>
    </g>
    <g stroke="#cbd5e1" stroke-width="2" fill="#f8fafc">
      <rect x="90" y="405" width="330" height="85" rx="9"/><rect x="480" y="405" width="330" height="85" rx="9"/><rect x="90" y="535" width="330" height="85" rx="9"/><rect x="480" y="535" width="330" height="85" rx="9"/>
    </g>
    <g font-size="36" text-anchor="middle">
      <text x="165" y="447">◆</text><text x="225" y="447">△</text><text x="285" y="447">□</text><text x="345" y="447">○</text>
      <text x="555" y="447">□</text><text x="615" y="447">△</text><text x="675" y="447">◇</text><text x="735" y="447">●</text>
      <text x="165" y="577">△</text><text x="225" y="577">□</text><text x="285" y="577">●</text><text x="345" y="577">◆</text>
      <text x="555" y="577">●</text><text x="615" y="577">◇</text><text x="675" y="577">△</text><text x="735" y="577">■</text>
    </g>
  </g>
</svg>
