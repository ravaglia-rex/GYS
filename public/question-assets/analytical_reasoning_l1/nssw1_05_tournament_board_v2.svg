<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" role="img" aria-labelledby="title desc">
  <title id="title">Known results from a seven-badge tournament</title>
  <desc id="desc">Diamond wins against star and hexagon. Triangle wins against circle and square. Hexagon wins against hollow circle and triangle. Square wins against diamond and star. Hollow circle wins against triangle and circle. Star wins against hexagon and hollow circle. Circle wins against square and diamond.</desc>
  <style>
    .head{fill:#273a52}.row1{fill:#fff;stroke:#c2ccd8;stroke-width:2}.row2{fill:#f3f6f9;stroke:#c2ccd8;stroke-width:2}.h{fill:#fff;font:700 20px Arial,sans-serif}.badge{fill:#16283e;font:700 32px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}.wins{fill:#16283e;font:700 30px Arial,sans-serif;text-anchor:middle;dominant-baseline:middle}
  </style>
  <rect width="700" height="500" fill="#fff"/>
  <rect class="head" x="40" y="20" width="620" height="54" rx="10"/>
  <text class="h" x="155" y="54" text-anchor="middle">BADGE</text><text class="h" x="455" y="54" text-anchor="middle">WINS AGAINST</text>
  <g transform="translate(40 84)"><rect class="row1" width="620" height="52" rx="7"/><text class="badge" x="115" y="27">◆</text><text class="wins" x="415" y="27">★   ⬟</text></g>
  <g transform="translate(40 140)"><rect class="row2" width="620" height="52" rx="7"/><text class="badge" x="115" y="27">▲</text><text class="wins" x="415" y="27">●   ■</text></g>
  <g transform="translate(40 196)"><rect class="row1" width="620" height="52" rx="7"/><text class="badge" x="115" y="27">⬟</text><text class="wins" x="415" y="27">○   ▲</text></g>
  <g transform="translate(40 252)"><rect class="row2" width="620" height="52" rx="7"/><text class="badge" x="115" y="27">■</text><text class="wins" x="415" y="27">◆   ★</text></g>
  <g transform="translate(40 308)"><rect class="row1" width="620" height="52" rx="7"/><text class="badge" x="115" y="27">○</text><text class="wins" x="415" y="27">▲   ●</text></g>
  <g transform="translate(40 364)"><rect class="row2" width="620" height="52" rx="7"/><text class="badge" x="115" y="27">★</text><text class="wins" x="415" y="27">⬟   ○</text></g>
  <g transform="translate(40 420)"><rect class="row1" width="620" height="52" rx="7"/><text class="badge" x="115" y="27">●</text><text class="wins" x="415" y="27">■   ◆</text></g>
</svg>
