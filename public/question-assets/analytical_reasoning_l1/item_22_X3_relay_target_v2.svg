<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Target communication network before relay H is removed</title>
  <desc id="desc">Relay H is connected to P, Q, and R. Q is also connected to S, and R is also connected to T.</desc>
  <style>.edge{stroke:#46566b;stroke-width:6}.node{fill:#dcecff;stroke:#336b9f;stroke-width:2}.relay{fill:#ffe3dd;stroke:#a94435;stroke-width:2.5}.lab{font:700 22px system-ui,sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:central}</style>
  <path d="M500 125L230 65 M500 125L500 250 M500 125L770 65 M500 250L230 250 M770 65L860 205" class="edge"/>
  <g class="node"><circle cx="230" cy="65" r="27"/><circle cx="500" cy="250" r="27"/><circle cx="770" cy="65" r="27"/><circle cx="230" cy="250" r="27"/><circle cx="860" cy="205" r="27"/></g>
  <circle cx="500" cy="125" r="29" class="relay"/>
  <g class="lab"><text x="500" y="125">H×</text><text x="230" y="65">P</text><text x="500" y="250">Q</text><text x="770" y="65">R</text><text x="230" y="250">S</text><text x="860" y="205">T</text></g>
</svg>
