<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">Robot route network from S to T</title>
  <desc id="desc">S connects to A and B. A connects to C and D. B connects to C and E. C connects to D, E, and F. D and E connect to F. F connects to T.</desc>
  <style>
    .edge { stroke:#526984; stroke-width:5; stroke-linecap:round; }
    .node { fill:#fff; stroke:#243a5a; stroke-width:5; }
    .endpoint { fill:#e7f2ff; }
    .label { font:700 28px sans-serif; fill:#243a5a; text-anchor:middle; dominant-baseline:middle; }
  </style>
  <rect width="860" height="520" fill="#fff"/>
  <g class="edge">
    <line x1="75" y1="260" x2="220" y2="145"/><line x1="75" y1="260" x2="220" y2="375"/>
    <line x1="220" y1="145" x2="390" y2="190"/><line x1="220" y1="145" x2="390" y2="75"/>
    <line x1="220" y1="375" x2="390" y2="190"/><line x1="220" y1="375" x2="390" y2="445"/>
    <line x1="390" y1="190" x2="390" y2="75"/><line x1="390" y1="190" x2="390" y2="445"/><line x1="390" y1="190" x2="610" y2="260"/>
    <line x1="390" y1="75" x2="610" y2="260"/><line x1="390" y1="445" x2="610" y2="260"/>
    <line x1="610" y1="260" x2="785" y2="260"/>
  </g>
  <g>
    <circle class="node endpoint" cx="75" cy="260" r="40"/><text class="label" x="75" y="262">S</text>
    <circle class="node" cx="220" cy="145" r="40"/><text class="label" x="220" y="147">A</text>
    <circle class="node" cx="220" cy="375" r="40"/><text class="label" x="220" y="377">B</text>
    <circle class="node" cx="390" cy="190" r="40"/><text class="label" x="390" y="192">C</text>
    <circle class="node" cx="390" cy="75" r="40"/><text class="label" x="390" y="77">D</text>
    <circle class="node" cx="390" cy="445" r="40"/><text class="label" x="390" y="447">E</text>
    <circle class="node" cx="610" cy="260" r="40"/><text class="label" x="610" y="262">F</text>
    <circle class="node endpoint" cx="785" cy="260" r="40"/><text class="label" x="785" y="262">T</text>
  </g>
</svg>
