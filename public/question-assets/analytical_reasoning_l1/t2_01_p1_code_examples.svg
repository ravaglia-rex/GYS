<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Three symbol-code examples and one target</title>
  <desc id="desc">Example 1 shows triangle, square, and circle with the code letters K, M, and N. Example 2 shows square, circle, and diamond with J, M, and N. Example 3 shows triangle, circle, and star with K, L, and N. The target shows triangle, square, and circle followed by three unknown code positions.</desc>
  <defs>
    <symbol id="triangle" viewBox="-24 -24 48 48"><polygon points="0,-23 22,20 -22,20"/></symbol>
    <symbol id="square" viewBox="-24 -24 48 48"><rect x="-21" y="-21" width="42" height="42" rx="2"/></symbol>
    <symbol id="circle" viewBox="-24 -24 48 48"><circle r="21"/></symbol>
    <symbol id="diamond" viewBox="-24 -24 48 48"><polygon points="0,-23 23,0 0,23 -23,0"/></symbol>
    <symbol id="star" viewBox="-24 -24 48 48"><polygon points="0,-23 6.2,-8.5 21.9,-7.1 10,3.2 13.5,18.6 0,10 -13.5,18.6 -10,3.2 -21.9,-7.1 -6.2,-8.5"/></symbol>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536474"/></marker>
  </defs>
  <style>
    .label { font:700 22px Arial,sans-serif; fill:#263746; }
    .code { font:700 30px Arial,sans-serif; fill:#1c3144; text-anchor:middle; }
    .unknown { font:700 27px Arial,sans-serif; fill:#174a78; text-anchor:middle; }
    .shape { fill:#1c3144; }
    .group { fill:#fff; stroke:#a9b6c2; stroke-width:2.5; }
    .target { fill:#f4f8fb; stroke:#174a78; stroke-width:3; }
    .divider { stroke:#d5dde4; stroke-width:2; }
    .flow { stroke:#536474; stroke-width:3; marker-end:url(#arrow); }
  </style>
  <rect width="1120" height="520" fill="#fff"/>

  <line x1="55" y1="390" x2="1065" y2="390" class="divider"/>

  <text x="65" y="88" class="label">EXAMPLE 1</text>
  <rect x="265" y="42" width="280" height="82" rx="12" class="group"/>
  <use href="#triangle" x="302" y="59" width="48" height="48" class="shape"/>
  <use href="#square" x="381" y="59" width="48" height="48" class="shape"/>
  <use href="#circle" x="460" y="59" width="48" height="48" class="shape"/>
  <line x1="579" y1="83" x2="650" y2="83" class="flow"/>
  <rect x="686" y="42" width="280" height="82" rx="12" class="group"/>
  <text x="756" y="93" class="code">K</text>
  <text x="826" y="93" class="code">M</text>
  <text x="896" y="93" class="code">N</text>

  <text x="65" y="206" class="label">EXAMPLE 2</text>
  <rect x="265" y="160" width="280" height="82" rx="12" class="group"/>
  <use href="#square" x="302" y="177" width="48" height="48" class="shape"/>
  <use href="#circle" x="381" y="177" width="48" height="48" class="shape"/>
  <use href="#diamond" x="460" y="177" width="48" height="48" class="shape"/>
  <line x1="579" y1="201" x2="650" y2="201" class="flow"/>
  <rect x="686" y="160" width="280" height="82" rx="12" class="group"/>
  <text x="756" y="211" class="code">J</text>
  <text x="826" y="211" class="code">M</text>
  <text x="896" y="211" class="code">N</text>

  <text x="65" y="324" class="label">EXAMPLE 3</text>
  <rect x="265" y="278" width="280" height="82" rx="12" class="group"/>
  <use href="#triangle" x="302" y="295" width="48" height="48" class="shape"/>
  <use href="#circle" x="381" y="295" width="48" height="48" class="shape"/>
  <use href="#star" x="460" y="295" width="48" height="48" class="shape"/>
  <line x1="579" y1="319" x2="650" y2="319" class="flow"/>
  <rect x="686" y="278" width="280" height="82" rx="12" class="group"/>
  <text x="756" y="329" class="code">K</text>
  <text x="826" y="329" class="code">L</text>
  <text x="896" y="329" class="code">N</text>

  <text x="65" y="469" class="label">TARGET</text>
  <rect x="265" y="418" width="280" height="82" rx="12" class="target"/>
  <use href="#triangle" x="302" y="435" width="48" height="48" class="shape"/>
  <use href="#square" x="381" y="435" width="48" height="48" class="shape"/>
  <use href="#circle" x="460" y="435" width="48" height="48" class="shape"/>
  <line x1="579" y1="459" x2="650" y2="459" class="flow"/>
  <rect x="686" y="418" width="280" height="82" rx="12" class="target"/>
  <text x="756" y="470" class="unknown">?</text>
  <text x="826" y="470" class="unknown">?</text>
  <text x="896" y="470" class="unknown">?</text>
</svg>
