<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Four possible sixth sorting-scanner states</title><desc id="desc">Four options show crate orders and scanner arrows. Options A, B, and D share one crate order but place or point the scanner differently; option C leaves the compared pair unswapped.</desc>
  <style>.panel{fill:#f8fafc;stroke:#a0acbb;stroke-width:1.5}.crate{fill:#e7c690;stroke:#74542c;stroke-width:2}.num{font:700 17px system-ui,sans-serif;fill:#242017;text-anchor:middle}.opt{font:700 22px system-ui,sans-serif;fill:#172033}.arrow{font:700 28px system-ui,sans-serif;fill:#1267a8;text-anchor:middle}</style>
  <g transform="translate(25,25)"><rect width="450" height="160" rx="9" class="panel"/><text x="18" y="30" class="opt">A</text><g transform="translate(55,55)"><g class="crate"><rect x="0" y="51" width="55" height="21"/><rect x="75" y="42" width="55" height="30"/><rect x="150" y="24" width="55" height="48"/><rect x="225" y="12" width="55" height="60"/><rect x="300" y="33" width="55" height="39"/></g><g class="num"><text x="27" y="69">1</text><text x="102" y="65">2</text><text x="177" y="55">4</text><text x="252" y="50">5</text><text x="327" y="60">3</text></g><text x="65" y="30" class="arrow">←</text></g></g>
  <g transform="translate(525,25)"><rect width="450" height="160" rx="9" class="panel"/><text x="18" y="30" class="opt">B</text><g transform="translate(55,55)"><g class="crate"><rect x="0" y="51" width="55" height="21"/><rect x="75" y="42" width="55" height="30"/><rect x="150" y="24" width="55" height="48"/><rect x="225" y="12" width="55" height="60"/><rect x="300" y="33" width="55" height="39"/></g><g class="num"><text x="27" y="69">1</text><text x="102" y="65">2</text><text x="177" y="55">4</text><text x="252" y="50">5</text><text x="327" y="60">3</text></g><text x="215" y="30" class="arrow">→</text></g></g>
  <g transform="translate(25,225)"><rect width="450" height="160" rx="9" class="panel"/><text x="18" y="30" class="opt">C</text><g transform="translate(55,55)"><g class="crate"><rect x="0" y="51" width="55" height="21"/><rect x="75" y="24" width="55" height="48"/><rect x="150" y="42" width="55" height="30"/><rect x="225" y="12" width="55" height="60"/><rect x="300" y="33" width="55" height="39"/></g><g class="num"><text x="27" y="69">1</text><text x="102" y="55">4</text><text x="177" y="65">2</text><text x="252" y="50">5</text><text x="327" y="60">3</text></g><text x="215" y="30" class="arrow">→</text></g></g>
  <g transform="translate(525,225)"><rect width="450" height="160" rx="9" class="panel"/><text x="18" y="30" class="opt">D</text><g transform="translate(55,55)"><g class="crate"><rect x="0" y="51" width="55" height="21"/><rect x="75" y="42" width="55" height="30"/><rect x="150" y="24" width="55" height="48"/><rect x="225" y="12" width="55" height="60"/><rect x="300" y="33" width="55" height="39"/></g><g class="num"><text x="27" y="69">1</text><text x="102" y="65">2</text><text x="177" y="55">4</text><text x="252" y="50">5</text><text x="327" y="60">3</text></g><text x="215" y="30" class="arrow">←</text></g></g>
</svg>
