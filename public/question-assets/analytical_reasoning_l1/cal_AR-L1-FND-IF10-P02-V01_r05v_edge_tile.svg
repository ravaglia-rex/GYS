<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" aria-labelledby="title desc">
  <title id="title">Required edge symbols</title>
  <desc id="desc">The center opening requires star top, diamond right, circle bottom, and square left.</desc>
  <rect width="820" height="520" fill="#fff"/>
  <text x="410" y="35" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#243247">Required edges</text>
  <rect x="340" y="80" width="140" height="140" rx="10" fill="#f8fafc" stroke="#243247" stroke-width="4" stroke-dasharray="9 7"/>
  <text x="410" y="156" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#667085">OPEN</text>
  <g font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#243247"><text x="410" y="70" text-anchor="middle">★</text><text x="515" y="160" text-anchor="middle">◆</text><text x="410" y="260" text-anchor="middle">●</text><text x="305" y="160" text-anchor="middle">■</text></g>
  <g stroke="#243247" stroke-width="3"><line x1="410" y1="73" x2="410" y2="80"/><line x1="480" y1="150" x2="500" y2="150"/><line x1="410" y1="220" x2="410" y2="238"/><line x1="320" y1="150" x2="340" y2="150"/></g>
  <line x1="60" y1="290" x2="760" y2="290" stroke="#d6deea" stroke-width="2"/><text x="410" y="325" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#243247">Tile options</text>
  <g fill="#f2f5f9" stroke="#243247" stroke-width="4"><rect x="35" y="350" width="150" height="150" rx="12"/><rect x="235" y="350" width="150" height="150" rx="12"/><rect x="435" y="350" width="150" height="150" rx="12"/><rect x="635" y="350" width="150" height="150" rx="12"/></g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#243247"><text x="45" y="375">A</text><text x="245" y="375">B</text><text x="445" y="375">C</text><text x="645" y="375">D</text></g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#243247">
    <text x="110" y="386" text-anchor="middle">◆</text><text x="165" y="435" text-anchor="middle">★</text><text x="110" y="490" text-anchor="middle">●</text><text x="55" y="435" text-anchor="middle">■</text>
    <text x="310" y="386" text-anchor="middle">◆</text><text x="365" y="435" text-anchor="middle">●</text><text x="310" y="490" text-anchor="middle">★</text><text x="255" y="435" text-anchor="middle">■</text>
    <text x="510" y="386" text-anchor="middle">◆</text><text x="565" y="435" text-anchor="middle">■</text><text x="510" y="490" text-anchor="middle">●</text><text x="455" y="435" text-anchor="middle">★</text>
    <text x="710" y="386" text-anchor="middle">◆</text><text x="765" y="435" text-anchor="middle">●</text><text x="710" y="490" text-anchor="middle">■</text><text x="655" y="435" text-anchor="middle">★</text>
  </g>
</svg>
