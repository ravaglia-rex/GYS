<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Four possible State 5 arrangements on the sorting rail</title>
  <desc id="desc">Option A has triangle, hollow circle, circle, hollow triangle, square, hollow square, with a divider after the second card pointing left. Option B has triangle, circle, hollow circle, hollow triangle, square, hollow square, with a divider after the second card pointing left. Option C has triangle, circle, hollow circle, hollow triangle, square, hollow square, with a divider after the first card pointing left. Option D has the same cards and divider position as option C, but points right.</desc>
  <style>.rail{stroke:#8290a2;stroke-width:7;stroke-linecap:round}.card{fill:#fff;stroke:#263b58;stroke-width:3}.sym{font:700 39px "DejaVu Sans",sans-serif;fill:#243a57;text-anchor:middle;dominant-baseline:middle}.label{font:700 24px sans-serif;fill:#243a57}.divider{stroke:#b34f2c;stroke-width:7}.dirlabel{font:700 20px sans-serif;fill:#b34f2c}.note{font:600 17px sans-serif;fill:#607087}</style>
  <rect width="1120" height="560" fill="#fff"/>
  <text class="note" x="170" y="32">Each option uses the same rail, divider, and direction display as the example states.</text>
  <defs><g id="slot"><rect class="card" width="104" height="74" rx="8"/></g></defs>

  <g transform="translate(90 72)"><text class="label" x="0" y="47">A</text><line class="rail" x1="145" y1="78" x2="865" y2="78"/><g transform="translate(145 9)"><use href="#slot"/><text class="sym" x="52" y="39">▲</text></g><g transform="translate(255 9)"><use href="#slot"/><text class="sym" x="52" y="39">○</text></g><g transform="translate(365 9)"><use href="#slot"/><text class="sym" x="52" y="39">●</text></g><g transform="translate(475 9)"><use href="#slot"/><text class="sym" x="52" y="39">△</text></g><g transform="translate(585 9)"><use href="#slot"/><text class="sym" x="52" y="39">■</text></g><g transform="translate(695 9)"><use href="#slot"/><text class="sym" x="52" y="39">□</text></g><line class="divider" x1="362" y1="0" x2="362" y2="92"/><text class="dirlabel" x="875" y="54">DIRECTION ←</text></g>
  <g transform="translate(90 190)"><text class="label" x="0" y="47">B</text><line class="rail" x1="145" y1="78" x2="865" y2="78"/><g transform="translate(145 9)"><use href="#slot"/><text class="sym" x="52" y="39">▲</text></g><g transform="translate(255 9)"><use href="#slot"/><text class="sym" x="52" y="39">●</text></g><g transform="translate(365 9)"><use href="#slot"/><text class="sym" x="52" y="39">○</text></g><g transform="translate(475 9)"><use href="#slot"/><text class="sym" x="52" y="39">△</text></g><g transform="translate(585 9)"><use href="#slot"/><text class="sym" x="52" y="39">■</text></g><g transform="translate(695 9)"><use href="#slot"/><text class="sym" x="52" y="39">□</text></g><line class="divider" x1="362" y1="0" x2="362" y2="92"/><text class="dirlabel" x="875" y="54">DIRECTION ←</text></g>
  <g transform="translate(90 308)"><text class="label" x="0" y="47">C</text><line class="rail" x1="145" y1="78" x2="865" y2="78"/><g transform="translate(145 9)"><use href="#slot"/><text class="sym" x="52" y="39">▲</text></g><g transform="translate(255 9)"><use href="#slot"/><text class="sym" x="52" y="39">●</text></g><g transform="translate(365 9)"><use href="#slot"/><text class="sym" x="52" y="39">○</text></g><g transform="translate(475 9)"><use href="#slot"/><text class="sym" x="52" y="39">△</text></g><g transform="translate(585 9)"><use href="#slot"/><text class="sym" x="52" y="39">■</text></g><g transform="translate(695 9)"><use href="#slot"/><text class="sym" x="52" y="39">□</text></g><line class="divider" x1="252" y1="0" x2="252" y2="92"/><text class="dirlabel" x="875" y="54">DIRECTION ←</text></g>
  <g transform="translate(90 426)"><text class="label" x="0" y="47">D</text><line class="rail" x1="145" y1="78" x2="865" y2="78"/><g transform="translate(145 9)"><use href="#slot"/><text class="sym" x="52" y="39">▲</text></g><g transform="translate(255 9)"><use href="#slot"/><text class="sym" x="52" y="39">●</text></g><g transform="translate(365 9)"><use href="#slot"/><text class="sym" x="52" y="39">○</text></g><g transform="translate(475 9)"><use href="#slot"/><text class="sym" x="52" y="39">△</text></g><g transform="translate(585 9)"><use href="#slot"/><text class="sym" x="52" y="39">■</text></g><g transform="translate(695 9)"><use href="#slot"/><text class="sym" x="52" y="39">□</text></g><line class="divider" x1="252" y1="0" x2="252" y2="92"/><text class="dirlabel" x="875" y="54">DIRECTION →</text></g>
</svg>
