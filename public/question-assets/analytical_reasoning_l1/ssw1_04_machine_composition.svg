<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-labelledby="title desc">
  <title id="title">Machine K and M examples and target</title>
  <desc id="desc">Machine K changes triangle, hollow circle, square, diamond to diamond, triangle, hollow circle, square. Machine M changes the same input to hollow triangle, hollow circle, square, diamond. Target is solid circle, hollow square, solid triangle, hollow diamond, and is sent through M then K.</desc>
  <rect width="860" height="360" fill="#fff"/>
  <g font-family="Arial, sans-serif" dominant-baseline="middle">
    <g font-size="18" font-weight="700" fill="#334155"><text x="40" y="62">MACHINE K</text><text x="40" y="158">MACHINE M</text><text x="40" y="278">TARGET</text></g>
    <g stroke="#cbd5e1" stroke-width="2" fill="#f8fafc">
      <rect x="175" y="28" width="240" height="68" rx="9"/><rect x="570" y="28" width="240" height="68" rx="9"/>
      <rect x="175" y="124" width="240" height="68" rx="9"/><rect x="570" y="124" width="240" height="68" rx="9"/>
      <rect x="175" y="244" width="240" height="68" rx="9"/>
    </g>
    <g fill="#0f172a" font-size="38" text-anchor="middle">
      <text x="220" y="62">▲</text><text x="270" y="62">○</text><text x="320" y="62">■</text><text x="370" y="62">◆</text><text x="492" y="62" font-size="31">→ K →</text><text x="615" y="62">◆</text><text x="665" y="62">▲</text><text x="715" y="62">○</text><text x="765" y="62">■</text>
      <text x="220" y="158">▲</text><text x="270" y="158">○</text><text x="320" y="158">■</text><text x="370" y="158">◆</text><text x="492" y="158" font-size="31">→ M →</text><text x="615" y="158">△</text><text x="665" y="158">○</text><text x="715" y="158">■</text><text x="765" y="158">◆</text>
      <text x="220" y="278">●</text><text x="270" y="278">□</text><text x="320" y="278">▲</text><text x="370" y="278">◇</text><text x="570" y="278" font-size="30" font-weight="700">M → K → [?]</text>
    </g>
  </g>
</svg>
