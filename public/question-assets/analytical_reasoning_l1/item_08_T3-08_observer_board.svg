<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Three-by-three board surrounded by four labelled observers</title>
  <desc id="desc">The north-side observer is above the board, the south-side observer below it, the west-side observer to its left, and the east-side observer to its right. On the board, a star is in the north-center square, a triangle in the west-center square, a solid circle in the east-center square, and an arrow pointing toward the east-side observer in the south-center square. All other squares are empty.</desc>
  <style>
    .board { fill:#fff; stroke:#263746; stroke-width:3; }
    .grid { stroke:#aeb9c2; stroke-width:2; }
    .observer { fill:#eef5fa; stroke:#52748e; stroke-width:2; }
    .observer-text { font:700 18px sans-serif; fill:#174a78; text-anchor:middle; dominant-baseline:middle; }
    .shape { font:700 42px "DejaVu Sans",sans-serif; fill:#172b3a; text-anchor:middle; dominant-baseline:middle; }
    .arrow { font:700 50px sans-serif; fill:#174a78; text-anchor:middle; dominant-baseline:middle; }
  </style>
  <rect width="900" height="620" fill="#fff"/>

  <rect class="observer" x="330" y="28" width="240" height="52" rx="9"/>
  <text class="observer-text" x="450" y="55">NORTH-SIDE OBSERVER</text>
  <rect class="observer" x="330" y="540" width="240" height="52" rx="9"/>
  <text class="observer-text" x="450" y="567">SOUTH-SIDE OBSERVER</text>
  <rect class="observer" x="20" y="284" width="240" height="52" rx="9"/>
  <text class="observer-text" x="140" y="311">WEST-SIDE OBSERVER</text>
  <rect class="observer" x="640" y="284" width="240" height="52" rx="9"/>
  <text class="observer-text" x="760" y="311">EAST-SIDE OBSERVER</text>

  <rect class="board" x="300" y="150" width="300" height="300" rx="6"/>
  <line class="grid" x1="400" y1="150" x2="400" y2="450"/>
  <line class="grid" x1="500" y1="150" x2="500" y2="450"/>
  <line class="grid" x1="300" y1="250" x2="600" y2="250"/>
  <line class="grid" x1="300" y1="350" x2="600" y2="350"/>

  <text class="shape" x="450" y="201">★</text>
  <text class="shape" x="350" y="301">▲</text>
  <text class="shape" x="550" y="301">●</text>
  <text class="arrow" x="450" y="401">→</text>
</svg>
