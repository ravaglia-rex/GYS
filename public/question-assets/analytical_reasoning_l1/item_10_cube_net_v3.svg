<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img" aria-labelledby="title desc">
  <title id="title">Cube net with six labelled square faces</title>
  <desc id="desc">A staircase-shaped cube net. The top row has triangle then square. Directly below the square is circle, followed by diamond. Directly below the diamond is star, followed by pentagon.</desc>
  <rect width="360" height="270" fill="white"/>
  <g fill="white" stroke="#111" stroke-width="3">
    <rect x="20" y="20" width="70" height="70"/>
    <rect x="90" y="20" width="70" height="70"/>
    <rect x="90" y="90" width="70" height="70"/>
    <rect x="160" y="90" width="70" height="70"/>
    <rect x="160" y="160" width="70" height="70"/>
    <rect x="230" y="160" width="70" height="70"/>
  </g>
  <g fill="#111" font-family="Arial, sans-serif" font-size="34" text-anchor="middle" dominant-baseline="middle">
    <text x="55" y="55">▲</text>
    <text x="125" y="55">■</text>
    <text x="125" y="125">●</text>
    <text x="195" y="125">◆</text>
    <text x="195" y="195">★</text>
    <text x="265" y="195">⬟</text>
  </g>
</svg>
