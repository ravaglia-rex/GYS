<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="220" viewBox="0 0 1040 220" role="img" aria-labelledby="title desc">
  <title id="title">Three control-labelled transitions ending in a missing section</title>
  <desc id="desc">The first section has a solid triangle upper left and a hollow circle lower right. Control K produces a section with the solid triangle upper right and hollow circle lower left. Control M produces a section with the solid triangle upper left and hollow circle lower right. Control N then produces a missing section. A light gray x marks every empty position.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#174a78"/></marker>
  </defs>
  <style>
    .section { fill:#fff; stroke:#263746; stroke-width:2.5; }
    .grid { stroke:#aeb9c2; stroke-width:1.5; }
    .solid { fill:#172b3a; stroke:#172b3a; stroke-width:2.2; }
    .hollow { fill:#fff; stroke:#172b3a; stroke-width:2.6; }
    .empty { font:400 25px sans-serif; fill:#aab3bb; text-anchor:middle; dominant-baseline:middle; }
    .control { font:700 24px sans-serif; fill:#174a78; text-anchor:middle; }
    .flow { stroke:#174a78; stroke-width:3; marker-end:url(#arrow); }
    .missing { font:700 34px sans-serif; fill:#174a78; text-anchor:middle; dominant-baseline:middle; }
  </style>
  <rect width="1040" height="220" fill="#fff"/>

  <g transform="translate(35 55)">
    <rect class="section" width="120" height="120" rx="6"/><path class="grid" d="M60 0V120M0 60H120"/>
    <polygon class="solid" points="30,18 18,42 42,42"/><text class="empty" x="90" y="31">×</text>
    <text class="empty" x="30" y="91">×</text><circle class="hollow" cx="90" cy="91" r="11"/>
  </g>
  <line class="flow" x1="175" y1="115" x2="280" y2="115"/><text class="control" x="227" y="94">K</text>

  <g transform="translate(300 55)">
    <rect class="section" width="120" height="120" rx="6"/><path class="grid" d="M60 0V120M0 60H120"/>
    <text class="empty" x="30" y="31">×</text><polygon class="solid" points="90,18 78,42 102,42"/>
    <circle class="hollow" cx="30" cy="91" r="11"/><text class="empty" x="90" y="91">×</text>
  </g>
  <line class="flow" x1="440" y1="115" x2="545" y2="115"/><text class="control" x="492" y="94">M</text>

  <g transform="translate(565 55)">
    <rect class="section" width="120" height="120" rx="6"/><path class="grid" d="M60 0V120M0 60H120"/>
    <polygon class="solid" points="30,18 18,42 42,42"/><text class="empty" x="90" y="31">×</text>
    <text class="empty" x="30" y="91">×</text><circle class="hollow" cx="90" cy="91" r="11"/>
  </g>
  <line class="flow" x1="705" y1="115" x2="810" y2="115"/><text class="control" x="757" y="94">N</text>

  <g transform="translate(830 55)">
    <rect class="section" width="120" height="120" rx="6"/>
    <text class="missing" x="60" y="61">?</text>
  </g>
</svg>
