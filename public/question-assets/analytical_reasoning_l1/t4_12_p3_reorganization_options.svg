<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Four possible after-reorganization charts</title>
  <desc id="desc">Four organization charts. A: N leads; A manages B; P manages D; M manages C. B: N leads; A manages B; P manages C; M manages D. C: N leads; B manages A; P manages D; M manages C. D: N leads; A manages C; P manages D; M manages B.</desc>
