<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">Forge and archive examples and target</title><desc id="desc">Forge moves loose to inside, inside to clipped, and clipped to loose. Archive moves clipped to inside, loose to clipped, and inside to loose. The target starts with a hollow circle inside, triangle clipped, square loose in Forge, and diamond loose in Archive.</desc>
  <style>
    .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#b8c5d0;stroke-width:2}.heading{font:700 25px sans-serif;fill:#243a57;text-anchor:middle}.section{font:700 24px sans-serif;fill:#174a78}.sub{font:700 19px sans-serif;fill:#3b5060;text-anchor:middle}.role{font:700 16px sans-serif;fill:#526a84;text-anchor:middle}.cell{stroke:#263b58;stroke-width:2.5}.inside{fill:#eef5fb}.clipped{fill:#fff4e9}.loose{fill:#f4f1f8}.arrow{fill:none;stroke:#d26928;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.route{font:700 22px sans-serif;fill:#8f4f17;text-anchor:middle}.divider{stroke:#d8e0e6;stroke-width:2}.edge{fill:none;stroke:#526b7b;stroke-width:2.4;stroke-linejoin:round}.node{fill:#fff;stroke:#253b4d;stroke-width:2.2}.promoted{fill:#fff3d9;stroke:#a86200;stroke-width:3}.person{font:700 19px sans-serif;fill:#173f63;text-anchor:middle;dominant-baseline:middle}.tag{font:700 13px sans-serif;fill:#8b5000;text-anchor:middle}.mark-solid{fill:#173f63;stroke:#173f63;stroke-width:3}.mark-hollow{fill:#fff;stroke:#173f63;stroke-width:3}
  </style>

  <defs>
    <g id="tri_s"><path class="mark-solid" d="M0-24L23 20H-23Z"/></g>
    <g id="tri_h"><path class="mark-hollow" d="M0-24L23 20H-23Z"/></g>
    <g id="square_s"><rect class="mark-solid" x="-20" y="-20" width="40" height="40" rx="2"/></g>
    <g id="circle_s"><circle class="mark-solid" r="21"/></g>
    <g id="circle_h"><circle class="mark-hollow" r="21"/></g>
    <g id="diamond_s"><path class="mark-solid" d="M0-24L24 0 0 24-24 0Z"/></g>
    <g id="star_s"><path class="mark-solid" d="M0-25L6-8 24-8 10 3 15 21 0 11-15 21-10 3-24-8-6-8Z"/></g>
  </defs>

  <rect class="bg" width="1200" height="870"/><text class="heading" x="600" y="40">HOW EACH ROOM CHANGES THE ITEMS</text>
  <text class="section" x="32" y="84">FORGE</text><text class="sub" x="350" y="84">BEFORE</text><text class="role" x="205.0" y="106">INSIDE</text><rect class="cell inside" x="145" y="120" width="120" height="92" rx="8"/><use href="#circle_h" transform="translate(205.0 168) scale(1.0)"/><text class="role" x="340.0" y="106">CLIPPED</text><rect class="cell clipped" x="280" y="120" width="120" height="92" rx="8"/><use href="#tri_s" transform="translate(340.0 168) scale(1.0)"/><text class="role" x="475.0" y="93"><tspan x="475.0">ROOM</tspan><tspan x="475.0" dy="17">LOOSE</tspan></text><rect class="cell loose" x="415" y="120" width="120" height="92" rx="8"/><use href="#square_s" transform="translate(475.0 168) scale(1.0)"/>
  <path class="arrow" d="M555 166H635M635 166l-20-14M635 166l-20 14"/><text class="sub" x="850" y="84">AFTER</text><text class="role" x="705.0" y="106">INSIDE</text><rect class="cell inside" x="645" y="120" width="120" height="92" rx="8"/><use href="#square_s" transform="translate(705.0 168) scale(1.0)"/><text class="role" x="840.0" y="106">CLIPPED</text><rect class="cell clipped" x="780" y="120" width="120" height="92" rx="8"/><use href="#circle_h" transform="translate(840.0 168) scale(1.0)"/><text class="role" x="975.0" y="93"><tspan x="975.0">ROOM</tspan><tspan x="975.0" dy="17">LOOSE</tspan></text><rect class="cell loose" x="915" y="120" width="120" height="92" rx="8"/><use href="#tri_s" transform="translate(975.0 168) scale(1.0)"/>
  <text class="section" x="32" y="314">ARCHIVE</text><text class="sub" x="350" y="314">BEFORE</text><text class="role" x="205.0" y="336">INSIDE</text><rect class="cell inside" x="145" y="350" width="120" height="92" rx="8"/><use href="#circle_h" transform="translate(205.0 398) scale(1.0)"/><text class="role" x="340.0" y="336">CLIPPED</text><rect class="cell clipped" x="280" y="350" width="120" height="92" rx="8"/><use href="#tri_s" transform="translate(340.0 398) scale(1.0)"/><text class="role" x="475.0" y="323"><tspan x="475.0">ROOM</tspan><tspan x="475.0" dy="17">LOOSE</tspan></text><rect class="cell loose" x="415" y="350" width="120" height="92" rx="8"/><use href="#square_s" transform="translate(475.0 398) scale(1.0)"/>
  <path class="arrow" d="M555 396H635M635 396l-20-14M635 396l-20 14"/><text class="sub" x="850" y="314">AFTER</text><text class="role" x="705.0" y="336">INSIDE</text><rect class="cell inside" x="645" y="350" width="120" height="92" rx="8"/><use href="#tri_s" transform="translate(705.0 398) scale(1.0)"/><text class="role" x="840.0" y="336">CLIPPED</text><rect class="cell clipped" x="780" y="350" width="120" height="92" rx="8"/><use href="#square_s" transform="translate(840.0 398) scale(1.0)"/><text class="role" x="975.0" y="323"><tspan x="975.0">ROOM</tspan><tspan x="975.0" dy="17">LOOSE</tspan></text><rect class="cell loose" x="915" y="350" width="120" height="92" rx="8"/><use href="#circle_h" transform="translate(975.0 398) scale(1.0)"/>
  <line class="divider" x1="35" y1="500" x2="1165" y2="500"/><text class="heading" x="600" y="548">TARGET — STARTING STATE</text>
  <text class="role" x="367.5" y="586">INSIDE</text><rect class="cell inside" x="300" y="600" width="135" height="92" rx="8"/><use href="#circle_h" transform="translate(367.5 648) scale(1.0)"/><text class="role" x="517.5" y="586">CLIPPED</text><rect class="cell clipped" x="450" y="600" width="135" height="92" rx="8"/><use href="#tri_s" transform="translate(517.5 648) scale(1.0)"/><text class="role" x="667.5" y="573"><tspan x="667.5">FORGE</tspan><tspan x="667.5" dy="17">LOOSE</tspan></text><rect class="cell loose" x="600" y="600" width="135" height="92" rx="8"/><use href="#square_s" transform="translate(667.5 648) scale(1.0)"/><text class="role" x="817.5" y="573"><tspan x="817.5">ARCHIVE</tspan><tspan x="817.5" dy="17">LOOSE</tspan></text><rect class="cell loose" x="750" y="600" width="135" height="92" rx="8"/><use href="#diamond_s" transform="translate(817.5 648) scale(1.0)"/>
  <text class="route" x="600" y="785">ROUTE: ARCHIVE → FORGE</text>
</svg>
