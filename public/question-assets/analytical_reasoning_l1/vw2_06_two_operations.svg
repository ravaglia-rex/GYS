<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">Two transformation examples, a target card, and four answer cards</title>
  <desc id="desc">Two examples show two by two cards before and after the same two operations in the same order. A target card and four options are shown.</desc>
  <style>.grid{fill:#fff;stroke:#263b58;stroke-width:3}.line{stroke:#a8b2bf;stroke-width:2}.lab{font:700 21px sans-serif;fill:#243a57;text-anchor:middle}.sym{font:700 34px "DejaVu Sans",sans-serif;fill:#243a57;text-anchor:middle;dominant-baseline:middle}.move{font:700 38px sans-serif;fill:#b34f2c;text-anchor:middle;dominant-baseline:middle}.opt{font:700 23px sans-serif;fill:#243a57}</style>
  <rect width="1160" height="650" fill="#fff"/>
  <defs><g id="g2"><rect class="grid" width="160" height="160" rx="6"/><path class="line" d="M80 0V160M0 80H160"/></g></defs>
  <text class="lab" x="255" y="35">EXAMPLE 1</text><text class="lab" x="755" y="35">EXAMPLE 2</text>
  <g transform="translate(85 62)"><use href="#g2"/><text class="sym" x="40" y="40">▲</text><text class="sym" x="120" y="40">○</text><text class="sym" x="40" y="120">◆</text><text class="sym" x="120" y="120">■</text></g><text class="move" x="285" y="145">→</text><g transform="translate(325 62)"><use href="#g2"/><text class="sym" x="40" y="40">▲</text><text class="sym" x="120" y="40">◆</text><text class="sym" x="40" y="120">○</text><text class="sym" x="120" y="120">■</text></g>
  <g transform="translate(585 62)"><use href="#g2"/><text class="sym" x="40" y="40">●</text><text class="sym" x="120" y="40">△</text><text class="sym" x="40" y="120">□</text><text class="sym" x="120" y="120">★</text></g><text class="move" x="785" y="145">→</text><g transform="translate(825 62)"><use href="#g2"/><text class="sym" x="40" y="40">●</text><text class="sym" x="120" y="40">□</text><text class="sym" x="40" y="120">△</text><text class="sym" x="120" y="120">★</text></g>
  <text class="lab" x="580" y="270">TARGET</text><g transform="translate(500 292)"><use href="#g2"/><text class="sym" x="40" y="40">■</text><text class="sym" x="120" y="40">●</text><text class="sym" x="40" y="120">◇</text><text class="sym" x="120" y="120">▲</text></g>
  <g transform="translate(85 525)"><text class="opt" x="0" y="23">A</text><g transform="translate(35)"><use href="#g2"/><text class="sym" x="40" y="40">▲</text><text class="sym" x="120" y="40">●</text><text class="sym" x="40" y="120">◇</text><text class="sym" x="120" y="120">■</text></g></g>
  <g transform="translate(335 525)"><text class="opt" x="0" y="23">B</text><g transform="translate(35)"><use href="#g2"/><text class="sym" x="40" y="40">◇</text><text class="sym" x="120" y="40">■</text><text class="sym" x="40" y="120">▲</text><text class="sym" x="120" y="120">●</text></g></g>
  <g transform="translate(585 525)"><text class="opt" x="0" y="23">C</text><g transform="translate(35)"><use href="#g2"/><text class="sym" x="40" y="40">■</text><text class="sym" x="120" y="40">◇</text><text class="sym" x="40" y="120">●</text><text class="sym" x="120" y="120">▲</text></g></g>
  <g transform="translate(835 525)"><text class="opt" x="0" y="23">D</text><g transform="translate(35)"><use href="#g2"/><text class="sym" x="40" y="40">□</text><text class="sym" x="120" y="40">○</text><text class="sym" x="40" y="120">◆</text><text class="sym" x="120" y="120">△</text></g></g>
</svg>
