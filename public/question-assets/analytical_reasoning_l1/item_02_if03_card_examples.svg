<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">One completed whole-card movement and one target</title>
  <desc id="desc">In the example, a bordered two-by-two card has a circle upper-left, upward arrow upper-right, hollow square lower-left, and diamond lower-right. The result has the hollow square upper-left, circle upper-right, diamond lower-left, and right arrow lower-right. The target card has a star upper-left, left arrow upper-right, solid square lower-left, and hollow circle lower-right. Its result is missing.</desc>
  <defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#174a78"/></marker></defs>
  <style>
    .card { fill:#fff; stroke:#263746; stroke-width:3; }
    .line { stroke:#a9b6c2; stroke-width:2; }
    .label { font:700 21px Arial,sans-serif; fill:#174a78; }
    .symbol { font:700 48px "Arial Unicode MS","Noto Sans Symbols 2",Arial,sans-serif; fill:#1c3144; text-anchor:middle; dominant-baseline:middle; }
    .flow { stroke:#174a78; stroke-width:4; marker-end:url(#flow-arrow); }
    .question { font:700 48px Arial,sans-serif; fill:#174a78; text-anchor:middle; dominant-baseline:middle; }
  </style>
  <rect width="1000" height="540" fill="#fff"/>

  <text x="55" y="150" class="label">EXAMPLE</text>
  <rect x="220" y="45" width="190" height="190" rx="9" class="card"/>
  <line x1="315" y1="45" x2="315" y2="235" class="line"/><line x1="220" y1="140" x2="410" y2="140" class="line"/>
  <circle cx="267.5" cy="92.5" r="22" fill="#1c3144"/>
  <text x="362.5" y="92.5" class="symbol">↑</text>
  <rect x="247" y="167" width="41" height="41" fill="#fff" stroke="#1c3144" stroke-width="3"/>
  <polygon points="362.5,162 388,187.5 362.5,213 337,187.5" fill="#1c3144"/>
  <line x1="450" y1="140" x2="545" y2="140" class="flow"/>
  <rect x="585" y="45" width="190" height="190" rx="9" class="card"/>
  <line x1="680" y1="45" x2="680" y2="235" class="line"/><line x1="585" y1="140" x2="775" y2="140" class="line"/>
  <rect x="612" y="72" width="41" height="41" fill="#fff" stroke="#1c3144" stroke-width="3"/>
  <circle cx="727.5" cy="92.5" r="22" fill="#1c3144"/>
  <polygon points="632.5,162 658,187.5 632.5,213 607,187.5" fill="#1c3144"/>
  <text x="727.5" y="187.5" class="symbol">→</text>

  <text x="55" y="415" class="label">TARGET</text>
  <rect x="220" y="310" width="190" height="190" rx="9" class="card"/>
  <line x1="315" y1="310" x2="315" y2="500" class="line"/><line x1="220" y1="405" x2="410" y2="405" class="line"/>
  <text x="267.5" y="357.5" class="symbol">★</text>
  <text x="362.5" y="357.5" class="symbol">←</text>
  <rect x="247" y="432" width="41" height="41" fill="#1c3144"/>
  <circle cx="362.5" cy="452.5" r="22" fill="#fff" stroke="#1c3144" stroke-width="3"/>
  <line x1="450" y1="405" x2="545" y2="405" class="flow"/>
  <rect x="585" y="310" width="190" height="190" rx="9" class="card"/>
  <text x="680" y="405" class="question">?</text>
</svg>
