<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">Two examples of a communication relay before and after retirement</title>
  <desc id="desc">Example one shows relay H connected to A and B with a separate C-D connection; afterward H is gone, A-B is connected, and C-D remains. Example two shows H connected to J, K, and L; afterward J, K, and L are all pairwise connected.</desc>
  <style>.panel{fill:#f8fafc;stroke:#9aa7b8;stroke-width:2}.edge{stroke:#46566b;stroke-width:5}.node{fill:#dcecff;stroke:#336b9f;stroke-width:2}.relay{fill:#ffe3dd;stroke:#a94435;stroke-width:2.5}.lab{font:700 19px system-ui,sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:central}.head{font:700 18px system-ui,sans-serif;fill:#172033}</style>
  <g transform="translate(20,30)"><text x="0" y="-8" class="head">EXAMPLE 1 - BEFORE</text><rect width="220" height="240" rx="10" class="panel"/><path d="M110 75L55 145 M110 75L165 145 M40 205H180" class="edge"/><g class="node"><circle cx="55" cy="145" r="23"/><circle cx="165" cy="145" r="23"/><circle cx="40" cy="205" r="23"/><circle cx="180" cy="205" r="23"/></g><circle cx="110" cy="75" r="25" class="relay"/><g class="lab"><text x="110" y="75">H×</text><text x="55" y="145">A</text><text x="165" y="145">B</text><text x="40" y="205">C</text><text x="180" y="205">D</text></g></g>
  <text x="270" y="155" class="head">→</text>
  <g transform="translate(315,30)"><text x="0" y="-8" class="head">AFTER</text><rect width="180" height="240" rx="10" class="panel"/><path d="M40 105H140 M25 195H155" class="edge"/><g class="node"><circle cx="40" cy="105" r="23"/><circle cx="140" cy="105" r="23"/><circle cx="25" cy="195" r="23"/><circle cx="155" cy="195" r="23"/></g><g class="lab"><text x="40" y="105">A</text><text x="140" y="105">B</text><text x="25" y="195">C</text><text x="155" y="195">D</text></g></g>
  <g transform="translate(550,30)"><text x="0" y="-8" class="head">EXAMPLE 2 - BEFORE</text><rect width="190" height="240" rx="10" class="panel"/><path d="M95 110L35 195 M95 110V195 M95 110L155 195" class="edge"/><g class="node"><circle cx="35" cy="195" r="23"/><circle cx="95" cy="195" r="23"/><circle cx="155" cy="195" r="23"/></g><circle cx="95" cy="110" r="25" class="relay"/><g class="lab"><text x="95" y="110">H×</text><text x="35" y="195">J</text><text x="95" y="195">K</text><text x="155" y="195">L</text></g></g>
  <text x="765" y="155" class="head">→</text>
  <g transform="translate(805,30)"><text x="0" y="-8" class="head">AFTER</text><rect width="175" height="240" rx="10" class="panel"/><path d="M25 190L87 95 L150 190 Z" class="edge" fill="none"/><g class="node"><circle cx="25" cy="190" r="23"/><circle cx="87" cy="95" r="23"/><circle cx="150" cy="190" r="23"/></g><g class="lab"><text x="25" y="190">J</text><text x="87" y="95">K</text><text x="150" y="190">L</text></g></g>
</svg>
