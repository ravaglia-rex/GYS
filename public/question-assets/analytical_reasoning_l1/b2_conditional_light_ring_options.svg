<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="700 680 700 500" role="img" aria-labelledby="title desc">
  <title id="title">Light-ring answer options</title>
  <desc id="desc">Four possible final light states and orange marker positions, labelled A through D.</desc>
  <defs>
    <style>
      .heading{font:700 38px Arial,sans-serif;fill:#24344d}.section{font:700 29px Arial,sans-serif;fill:#24344d}.label{font:600 22px Arial,sans-serif;fill:#52647e}.option{font:700 28px Arial,sans-serif;fill:#24344d}.plate{fill:#fbfcfe;stroke:#8797ad;stroke-width:7}.tab{fill:#e68145;stroke:#b85d28;stroke-width:3}.on{fill:#26364f;stroke:#26364f;stroke-width:4}.off{fill:#fff;stroke:#26364f;stroke-width:5}.flow{fill:none;stroke:#536c94;stroke-width:6;stroke-linecap:round}.divider{stroke:#dce3ec;stroke-width:3}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#536c94"/></marker>
  </defs>
  <rect x="700" y="680" width="700" height="500" fill="#fff"/>
  <text x="760" y="714" class="section">Options</text>
  <!-- A: right lights, wrong turn -->
  <text x="765" y="800" class="option">A</text><g transform="translate(875 835)"><circle r="69" class="plate"/><path d="M-71-12 L-91 0 -71 12 Z" class="tab"/><circle cx="0" cy="-50" r="15" class="on"/><circle cx="50" cy="0" r="15" class="on"/><circle cx="0" cy="50" r="15" class="off"/><circle cx="-50" cy="0" r="15" class="off"/></g>
  <!-- B: correct clockwise turn -->
  <text x="1080" y="800" class="option">B</text><g transform="translate(1190 835)"><circle r="69" class="plate"/><path d="M71-12 L91 0 71 12 Z" class="tab"/><circle cx="0" cy="-50" r="15" class="on"/><circle cx="50" cy="0" r="15" class="on"/><circle cx="0" cy="50" r="15" class="off"/><circle cx="-50" cy="0" r="15" class="off"/></g>
  <!-- C: comparison only -->
  <text x="765" y="1030" class="option">C</text><g transform="translate(875 1065)"><circle r="69" class="plate"/><path d="M-12-71 L0-91 12-71 Z" class="tab"/><circle cx="0" cy="-50" r="15" class="on"/><circle cx="50" cy="0" r="15" class="off"/><circle cx="0" cy="50" r="15" class="off"/><circle cx="-50" cy="0" r="15" class="on"/></g>
  <!-- D: comparison turned wrong way -->
  <text x="1080" y="1030" class="option">D</text><g transform="translate(1190 1065)"><circle r="69" class="plate"/><path d="M-71-12 L-91 0 -71 12 Z" class="tab"/><circle cx="0" cy="-50" r="15" class="off"/><circle cx="50" cy="0" r="15" class="off"/><circle cx="0" cy="50" r="15" class="on"/><circle cx="-50" cy="0" r="15" class="on"/></g>

</svg>
