<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Four possible research station corridor diagrams</title>
  <desc id="desc">Four diagrams labelled A through D have the same six-node branching corridor network but different assignments of Command, Laboratory, Medbay, Observatory, Greenhouse, and Tool Room.</desc>
  <style>
    .panel { fill: #f7f9fc; stroke: #95a2b4; stroke-width: 2; }
    .edge { stroke: #4a586b; stroke-width: 6; stroke-linecap: round; }
    .node { fill: #e0efff; stroke: #346a9e; stroke-width: 2.5; }
    .label { font: 700 20px system-ui, sans-serif; fill: #162235; text-anchor: middle; dominant-baseline: central; }
    .option { font: 700 24px system-ui, sans-serif; fill: #162235; }
  </style>

  <!--
    Panels are 380×200. Graph must stay inside — prior centers at local x=320
    overflowed past the panel, so panel-based option_crops clipped the right nodes.
  -->
  <g transform="translate(40,40)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">A</text>
    <g transform="translate(48,40)">
      <path d="M28 70H108 M108 70H188 M188 70H268 M188 70V128 H268" class="edge" fill="none"/>
      <g class="node"><circle cx="28" cy="70" r="22"/><circle cx="108" cy="70" r="22"/><circle cx="188" cy="70" r="22"/><circle cx="268" cy="70" r="22"/><circle cx="188" cy="128" r="22"/><circle cx="268" cy="128" r="22"/></g>
      <g class="label"><text x="28" y="70">C</text><text x="108" y="70">L</text><text x="188" y="70">T</text><text x="268" y="70">M</text><text x="188" y="128">O</text><text x="268" y="128">G</text></g>
    </g>
  </g>

  <g transform="translate(480,40)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">B</text>
    <g transform="translate(48,40)">
      <path d="M28 70H108 M108 70H188 M188 70H268 M188 70V128 H268" class="edge" fill="none"/>
      <g class="node"><circle cx="28" cy="70" r="22"/><circle cx="108" cy="70" r="22"/><circle cx="188" cy="70" r="22"/><circle cx="268" cy="70" r="22"/><circle cx="188" cy="128" r="22"/><circle cx="268" cy="128" r="22"/></g>
      <g class="label"><text x="28" y="70">G</text><text x="108" y="70">C</text><text x="188" y="70">T</text><text x="268" y="70">L</text><text x="188" y="128">O</text><text x="268" y="128">M</text></g>
    </g>
  </g>

  <g transform="translate(40,280)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">C</text>
    <g transform="translate(48,40)">
      <path d="M28 70H108 M108 70H188 M188 70H268 M188 70V128 H268" class="edge" fill="none"/>
      <g class="node"><circle cx="28" cy="70" r="22"/><circle cx="108" cy="70" r="22"/><circle cx="188" cy="70" r="22"/><circle cx="268" cy="70" r="22"/><circle cx="188" cy="128" r="22"/><circle cx="268" cy="128" r="22"/></g>
      <g class="label"><text x="28" y="70">C</text><text x="108" y="70">M</text><text x="188" y="70">T</text><text x="268" y="70">L</text><text x="188" y="128">O</text><text x="268" y="128">G</text></g>
    </g>
  </g>

  <g transform="translate(480,280)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">D</text>
    <g transform="translate(48,40)">
      <path d="M28 70H108 M108 70H188 M188 70H268 M188 70V128 H268" class="edge" fill="none"/>
      <g class="node"><circle cx="28" cy="70" r="22"/><circle cx="108" cy="70" r="22"/><circle cx="188" cy="70" r="22"/><circle cx="268" cy="70" r="22"/><circle cx="188" cy="128" r="22"/><circle cx="268" cy="128" r="22"/></g>
      <g class="label"><text x="28" y="70">C</text><text x="108" y="70">M</text><text x="188" y="70">G</text><text x="268" y="70">L</text><text x="188" y="128">O</text><text x="268" y="128">T</text></g>
    </g>
  </g>
</svg>
