<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Four possible research station corridor diagrams</title>
  <desc id="desc">Four diagrams labelled A through D have the same six-node branching corridor network but different assignments of Command, Laboratory, Medbay, Observatory, Greenhouse, and Tool Room.</desc>
  <style>
    .panel { fill: #f7f9fc; stroke: #95a2b4; stroke-width: 2; }
    .edge { stroke: #4a586b; stroke-width: 7; stroke-linecap: round; }
    .node { fill: #e0efff; stroke: #346a9e; stroke-width: 2.5; }
    .label { font: 700 22px system-ui, sans-serif; fill: #162235; text-anchor: middle; dominant-baseline: central; }
    .option { font: 700 24px system-ui, sans-serif; fill: #162235; }
  </style>

  <!-- Reusable six-node branching geometry. -->
  <g transform="translate(40,40)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">A</text>
    <g transform="translate(70,42)">
      <path d="M20 78H120 M120 78H220 M220 78H320 M220 78V138 H320" class="edge" fill="none"/>
      <g class="node"><circle cx="220" cy="78" r="24"/><circle cx="120" cy="78" r="24"/><circle cx="320" cy="78" r="24"/><circle cx="220" cy="138" r="24"/><circle cx="20" cy="78" r="24"/><circle cx="320" cy="138" r="24"/></g>
      <g class="label"><text x="220" y="78">T</text><text x="120" y="78">L</text><text x="320" y="78">M</text><text x="220" y="138">O</text><text x="20" y="78">C</text><text x="320" y="138">G</text></g>
    </g>
  </g>

  <g transform="translate(480,40)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">B</text>
    <g transform="translate(70,42)">
      <path d="M20 78H120 M120 78H220 M220 78H320 M220 78V138 H320" class="edge" fill="none"/>
      <g class="node"><circle cx="220" cy="78" r="24"/><circle cx="120" cy="78" r="24"/><circle cx="320" cy="78" r="24"/><circle cx="220" cy="138" r="24"/><circle cx="20" cy="78" r="24"/><circle cx="320" cy="138" r="24"/></g>
      <g class="label"><text x="220" y="78">T</text><text x="120" y="78">C</text><text x="320" y="78">L</text><text x="220" y="138">O</text><text x="20" y="78">G</text><text x="320" y="138">M</text></g>
    </g>
  </g>

  <g transform="translate(40,280)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">C</text>
    <g transform="translate(70,42)">
      <path d="M20 78H120 M120 78H220 M220 78H320 M220 78V138 H320" class="edge" fill="none"/>
      <g class="node"><circle cx="220" cy="78" r="24"/><circle cx="120" cy="78" r="24"/><circle cx="320" cy="78" r="24"/><circle cx="220" cy="138" r="24"/><circle cx="20" cy="78" r="24"/><circle cx="320" cy="138" r="24"/></g>
      <g class="label"><text x="220" y="78">T</text><text x="120" y="78">M</text><text x="320" y="78">L</text><text x="220" y="138">O</text><text x="20" y="78">C</text><text x="320" y="138">G</text></g>
    </g>
  </g>

  <g transform="translate(480,280)">
    <rect width="380" height="200" rx="12" class="panel"/><text x="18" y="34" class="option">D</text>
    <g transform="translate(70,42)">
      <path d="M20 78H120 M120 78H220 M220 78H320 M220 78V138 H320" class="edge" fill="none"/>
      <g class="node"><circle cx="220" cy="78" r="24"/><circle cx="120" cy="78" r="24"/><circle cx="320" cy="78" r="24"/><circle cx="220" cy="138" r="24"/><circle cx="20" cy="78" r="24"/><circle cx="320" cy="138" r="24"/></g>
      <g class="label"><text x="220" y="78">G</text><text x="120" y="78">M</text><text x="320" y="78">L</text><text x="220" y="138">O</text><text x="20" y="78">C</text><text x="320" y="138">T</text></g>
    </g>
  </g>
</svg>
