<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="title desc">
  <title id="title">Two-track shape-cycle grid</title>
  <desc id="desc">A three-by-three grid. Each cell contains a separate large hollow shape on the left and small solid symbol on the right. The bottom-right cell is missing.</desc>
  <style>
    .cell{fill:#fff;stroke:#506575;stroke-width:2}.large{fill:#fff;stroke:#173f63;stroke-width:4}.small{fill:#4b2c71;stroke:#4b2c71;stroke-width:2}.q{font:700 42px sans-serif;fill:#174a78;text-anchor:middle;dominant-baseline:middle}
  </style>
  <rect width="900" height="580" fill="#fff"/>
  <g transform="translate(150 30)">
    <rect class="cell" x="0" y="0" width="200" height="170"/><rect class="cell" x="200" y="0" width="200" height="170"/><rect class="cell" x="400" y="0" width="200" height="170"/>
    <rect class="cell" x="0" y="170" width="200" height="170"/><rect class="cell" x="200" y="170" width="200" height="170"/><rect class="cell" x="400" y="170" width="200" height="170"/>
    <rect class="cell" x="0" y="340" width="200" height="170"/><rect class="cell" x="200" y="340" width="200" height="170"/><rect class="cell" x="400" y="340" width="200" height="170" fill="#edf5fb"/>
    <!-- Row 1: large circle, triangle, square; small star, circle, diamond. -->
    <circle class="large" cx="65" cy="85" r="38"/><polygon class="small" points="150,61 157,77 175,79 162,91 166,109 150,100 134,109 138,91 125,79 143,77"/>
    <polygon class="large" points="265,44 223,126 307,126"/><circle class="small" cx="350" cy="85" r="18"/>
    <rect class="large" x="425" y="45" width="80" height="80"/><polygon class="small" points="550,64 571,85 550,106 529,85"/>
    <!-- Row 2: large triangle, square, diamond; small circle, diamond, triangle. -->
    <polygon class="large" points="65,214 23,296 107,296"/><circle class="small" cx="150" cy="255" r="18"/>
    <rect class="large" x="225" y="215" width="80" height="80"/><polygon class="small" points="350,234 371,255 350,276 329,255"/>
    <polygon class="large" points="465,215 505,255 465,295 425,255"/><polygon class="small" points="550,234 529,276 571,276"/>
    <!-- Row 3: large square, diamond, missing; small diamond, triangle, missing. -->
    <rect class="large" x="25" y="385" width="80" height="80"/><polygon class="small" points="150,404 171,425 150,446 129,425"/>
    <polygon class="large" points="265,385 305,425 265,465 225,425"/><polygon class="small" points="350,404 329,446 371,446"/>
    <text class="q" x="500" y="425">[?]</text>
  </g>
</svg>
