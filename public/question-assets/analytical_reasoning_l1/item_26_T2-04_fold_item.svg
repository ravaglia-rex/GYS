<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Two folds, an arrow-shaped cut, and four unfolded answer options</title>
  <desc id="desc">First fold the left half of a square to the right, then fold the bottom half upward. A northeast-pointing arrow cut is made near the upper-right of the folded packet. Options show four possible patterns after unfolding.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <marker id="cutHead" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,5 L6,2.5 z" fill="#111"/>
    </marker>
    <g id="cutNE">
      <line x1="-12" y1="12" x2="12" y2="-12" stroke="#111" stroke-width="3.5" marker-end="url(#cutHead)"/>
    </g>
    <style>
      .outline { fill: #fff; stroke: #222; stroke-width: 2.5; }
      .fold { stroke: #666; stroke-width: 2; stroke-dasharray: 7 6; }
      .move { stroke: #222; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 18px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #333; font-size: 15px; }
      .option { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 24px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1000" height="650" fill="#fff"/>
  <text x="28" y="34" class="label" font-weight="700">Fold sequence</text>

  <!-- Stage 1 -->
  <rect x="40" y="65" width="180" height="180" class="outline"/>
  <line x1="130" y1="65" x2="130" y2="245" class="fold"/>
  <path d="M78,150 C95,118 158,118 185,145" class="move"/>
  <text x="40" y="274" class="small">1. Left half folds right</text>

  <!-- Stage 2 -->
  <rect x="315" y="65" width="90" height="180" class="outline"/>
  <line x1="315" y1="155" x2="405" y2="155" class="fold"/>
  <path d="M360,218 C390,198 390,130 363,103" class="move"/>
  <text x="285" y="274" class="small">2. Bottom half folds up</text>

  <!-- Folded packet -->
  <rect x="515" y="65" width="90" height="90" class="outline"/>
  <use href="#cutNE" transform="translate(580 112)"/>
  <text x="493" y="184" class="small">Arrow-shaped cut</text>

  <line x1="655" y1="110" x2="720" y2="110" class="move"/>
  <text x="742" y="105" class="label">Unfold completely</text>

  <text x="28" y="330" class="label" font-weight="700">Answer options</text>

  <!-- Option A -->
  <text x="50" y="382" class="option">A</text>
  <rect x="85" y="350" width="150" height="150" class="outline"/>
  <line x1="160" y1="350" x2="160" y2="500" class="fold"/>
  <line x1="85" y1="425" x2="235" y2="425" class="fold"/>
  <use href="#cutNE" transform="translate(122 385) rotate(-90)"/><use href="#cutNE" transform="translate(202 385)"/>
  <use href="#cutNE" transform="translate(122 465) rotate(180)"/><use href="#cutNE" transform="translate(202 465) rotate(90)"/>

  <!-- Option B -->
  <text x="290" y="382" class="option">B</text>
  <rect x="325" y="350" width="150" height="150" class="outline"/>
  <line x1="400" y1="350" x2="400" y2="500" class="fold"/>
  <line x1="325" y1="425" x2="475" y2="425" class="fold"/>
  <use href="#cutNE" transform="translate(362 385)"/><use href="#cutNE" transform="translate(442 385)"/>
  <use href="#cutNE" transform="translate(362 465)"/><use href="#cutNE" transform="translate(442 465)"/>

  <!-- Option C -->
  <text x="530" y="382" class="option">C</text>
  <rect x="565" y="350" width="150" height="150" class="outline"/>
  <line x1="640" y1="350" x2="640" y2="500" class="fold"/>
  <line x1="565" y1="425" x2="715" y2="425" class="fold"/>
  <use href="#cutNE" transform="translate(602 385) rotate(90)"/><use href="#cutNE" transform="translate(682 385) rotate(180)"/>
  <use href="#cutNE" transform="translate(602 465)"/><use href="#cutNE" transform="translate(682 465) rotate(-90)"/>

  <!-- Option D -->
  <text x="770" y="382" class="option">D</text>
  <rect x="805" y="350" width="150" height="150" class="outline"/>
  <line x1="880" y1="350" x2="880" y2="500" class="fold"/>
  <line x1="805" y1="425" x2="955" y2="425" class="fold"/>
  <use href="#cutNE" transform="translate(842 385) rotate(-90)"/><use href="#cutNE" transform="translate(922 385)"/>
  <use href="#cutNE" transform="translate(842 465) rotate(-90)"/><use href="#cutNE" transform="translate(922 465)"/>

  <text x="85" y="540" class="small">Dashed lines show the original fold lines.</text>
</svg>
