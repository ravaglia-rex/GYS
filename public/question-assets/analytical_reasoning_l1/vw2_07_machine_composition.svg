<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="600" viewBox="0 0 1160 600" role="img" aria-labelledby="title desc">
  <title id="title">Examples for Machines R and T and a target row</title>
  <desc id="desc">Machine R maps triangle square hollow circle diamond to hollow circle triangle diamond hollow square, and circle hollow triangle star hollow square to star circle hollow square hollow triangle. Machine T has two more examples. The target is triangle circle hollow diamond square.</desc>
  <style>.box{fill:#fff;stroke:#263b58;stroke-width:3}.machine{fill:#eaf1f7;stroke:#263b58;stroke-width:3}.lab{font:700 22px sans-serif;fill:#243a57;text-anchor:middle}.sym{font:700 34px "DejaVu Sans",sans-serif;fill:#243a57;text-anchor:middle;dominant-baseline:middle}.arrow{font:700 34px sans-serif;fill:#b34f2c;text-anchor:middle;dominant-baseline:middle}.note{font:600 17px sans-serif;fill:#607087;text-anchor:middle}</style>
  <rect width="1160" height="600" fill="#fff"/>
  <defs><g id="row"><rect class="box" width="300" height="78" rx="8"/><path d="M75 0V78M150 0V78M225 0V78" stroke="#a8b2bf" stroke-width="2"/></g></defs>
  <text class="lab" x="580" y="35">MACHINE R — EXAMPLES</text>
  <g transform="translate(100 62)"><use href="#row"/><text class="sym" x="38" y="42">▲</text><text class="sym" x="113" y="42">■</text><text class="sym" x="188" y="42">○</text><text class="sym" x="263" y="42">◆</text></g><rect class="machine" x="465" y="73" width="90" height="56" rx="12"/><text class="lab" x="510" y="108">R</text><text class="arrow" x="430" y="103">→</text><text class="arrow" x="590" y="103">→</text><g transform="translate(630 62)"><use href="#row"/><text class="sym" x="38" y="42">○</text><text class="sym" x="113" y="42">▲</text><text class="sym" x="188" y="42">◆</text><text class="sym" x="263" y="42">□</text></g>
  <g transform="translate(100 155)"><use href="#row"/><text class="sym" x="38" y="42">●</text><text class="sym" x="113" y="42">△</text><text class="sym" x="188" y="42">★</text><text class="sym" x="263" y="42">□</text></g><rect class="machine" x="465" y="166" width="90" height="56" rx="12"/><text class="lab" x="510" y="201">R</text><text class="arrow" x="430" y="196">→</text><text class="arrow" x="590" y="196">→</text><g transform="translate(630 155)"><use href="#row"/><text class="sym" x="38" y="42">★</text><text class="sym" x="113" y="42">●</text><text class="sym" x="188" y="42">□</text><text class="sym" x="263" y="42">▲</text></g>
  <text class="lab" x="580" y="280">MACHINE T — EXAMPLES</text>
  <g transform="translate(100 307)"><use href="#row"/><text class="sym" x="38" y="42">▲</text><text class="sym" x="113" y="42">■</text><text class="sym" x="188" y="42">○</text><text class="sym" x="263" y="42">◆</text></g><rect class="machine" x="465" y="318" width="90" height="56" rx="12"/><text class="lab" x="510" y="353">T</text><text class="arrow" x="430" y="348">→</text><text class="arrow" x="590" y="348">→</text><g transform="translate(630 307)"><use href="#row"/><text class="sym" x="38" y="42">◇</text><text class="sym" x="113" y="42">■</text><text class="sym" x="188" y="42">▲</text><text class="sym" x="263" y="42">○</text></g>
  <g transform="translate(100 400)"><use href="#row"/><text class="sym" x="38" y="42">●</text><text class="sym" x="113" y="42">△</text><text class="sym" x="188" y="42">★</text><text class="sym" x="263" y="42">□</text></g><rect class="machine" x="465" y="411" width="90" height="56" rx="12"/><text class="lab" x="510" y="446">T</text><text class="arrow" x="430" y="441">→</text><text class="arrow" x="590" y="441">→</text><g transform="translate(630 400)"><use href="#row"/><text class="sym" x="38" y="42">■</text><text class="sym" x="113" y="42">△</text><text class="sym" x="188" y="42">●</text><text class="sym" x="263" y="42">★</text></g>
  <text class="lab" x="265" y="530">TARGET INPUT</text><g transform="translate(430 493)"><use href="#row"/><text class="sym" x="38" y="42">▲</text><text class="sym" x="113" y="42">●</text><text class="sym" x="188" y="42">◇</text><text class="sym" x="263" y="42">■</text></g><text class="note" x="580" y="585">Apply Machine R, then Machine T.</text>
</svg>
