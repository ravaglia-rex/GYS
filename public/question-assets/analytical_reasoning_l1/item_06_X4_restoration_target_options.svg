<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670" role="img" aria-labelledby="title desc">
  <title id="title">Initial restoration state, room sequence, and four possible final states</title>
  <desc id="desc">The initial state is left four lit, middle one, right two, loose three. The cart passes through Room A, then Room B, then Room A. Four answer rows show possible final states.</desc>
  <style>
    .heading { font:700 27px Arial,sans-serif; fill:#174a78; text-anchor:middle; }
    .subheading { font:700 18px Arial,sans-serif; fill:#1c3144; text-anchor:middle; }
    .column { font:700 15px Arial,sans-serif; fill:#536474; text-anchor:middle; }
    .value { font:700 24px Arial,sans-serif; fill:#1c3144; text-anchor:middle; dominant-baseline:middle; }
    .litvalue { font:700 20px Arial,sans-serif; fill:#174a78; text-anchor:middle; dominant-baseline:middle; }
    .option { font:700 23px Arial,sans-serif; fill:#174a78; text-anchor:middle; dominant-baseline:middle; }
    .box { fill:#fff; stroke:#263746; stroke-width:2.5; }
    .lit { fill:#fff4cc; stroke:#174a78; stroke-width:3; }
    .loose { fill:#f3f5f7; stroke:#263746; stroke-width:2.5; }
    .routebox { fill:#eef5fb; stroke:#174a78; stroke-width:2.5; }
    .route { font:700 24px Arial,sans-serif; fill:#174a78; text-anchor:middle; dominant-baseline:middle; }
  </style>
  <rect width="1100" height="670" fill="#fff"/>

  <text x="550" y="37" class="heading">INITIAL STATE</text>
  <g class="column"><text x="407.5" y="73">LEFT</text><text x="502.5" y="73">MIDDLE</text><text x="597.5" y="73">RIGHT</text><text x="692.5" y="73">LOOSE</text></g>
  <rect x="360" y="85" width="95" height="70" class="lit"/><rect x="455" y="85" width="95" height="70" class="box"/><rect x="550" y="85" width="95" height="70" class="box"/><rect x="645" y="85" width="95" height="70" class="loose"/>
  <text x="407.5" y="120" class="litvalue">4 (LIT)</text><text x="502.5" y="120" class="value">1</text><text x="597.5" y="120" class="value">2</text><text x="692.5" y="120" class="value">3</text>

  <text x="550" y="196" class="subheading">APPLY THE ROOMS IN THIS ORDER</text>
  <rect x="300" y="213" width="500" height="58" rx="10" class="routebox"/>
  <text x="550" y="242" class="route">ROOM A   →   ROOM B   →   ROOM A</text>

  <text x="550" y="316" class="heading">POSSIBLE FINAL STATES</text>
  <g class="column"><text x="190" y="350">OPTION</text><text x="330" y="350">LEFT</text><text x="510" y="350">MIDDLE</text><text x="690" y="350">RIGHT</text><text x="870" y="350">LOOSE</text></g>

  <!-- Option A -->
  <rect x="120" y="365" width="140" height="68" class="box"/><rect x="260" y="365" width="140" height="68" class="lit"/><rect x="400" y="365" width="180" height="68" class="box"/><rect x="580" y="365" width="220" height="68" class="box"/><rect x="800" y="365" width="140" height="68" class="loose"/>
  <text x="190" y="399" class="option">A</text><text x="330" y="399" class="litvalue">4 (LIT)</text><text x="490" y="399" class="value">1</text><text x="690" y="399" class="value">2</text><text x="870" y="399" class="value">3</text>

  <!-- Option B -->
  <rect x="120" y="433" width="140" height="68" class="box"/><rect x="260" y="433" width="140" height="68" class="box"/><rect x="400" y="433" width="180" height="68" class="box"/><rect x="580" y="433" width="220" height="68" class="lit"/><rect x="800" y="433" width="140" height="68" class="loose"/>
  <text x="190" y="467" class="option">B</text><text x="330" y="467" class="value">3</text><text x="490" y="467" class="value">1</text><text x="690" y="467" class="litvalue">2 (LIT)</text><text x="870" y="467" class="value">4</text>

  <!-- Option C -->
  <rect x="120" y="501" width="140" height="68" class="box"/><rect x="260" y="501" width="140" height="68" class="box"/><rect x="400" y="501" width="180" height="68" class="box"/><rect x="580" y="501" width="220" height="68" class="lit"/><rect x="800" y="501" width="140" height="68" class="loose"/>
  <text x="190" y="535" class="option">C</text><text x="330" y="535" class="value">3</text><text x="490" y="535" class="value">1</text><text x="690" y="535" class="litvalue">4 (LIT)</text><text x="870" y="535" class="value">2</text>

  <!-- Option D -->
  <rect x="120" y="569" width="140" height="68" class="box"/><rect x="260" y="569" width="140" height="68" class="box"/><rect x="400" y="569" width="180" height="68" class="lit"/><rect x="580" y="569" width="220" height="68" class="box"/><rect x="800" y="569" width="140" height="68" class="loose"/>
  <text x="190" y="603" class="option">D</text><text x="330" y="603" class="value">3</text><text x="490" y="603" class="litvalue">4 (LIT)</text><text x="690" y="603" class="value">2</text><text x="870" y="603" class="value">1</text>
</svg>
