<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="770" viewBox="0 0 1160 770">
  <rect width="1160" height="770" fill="#faf5e8"/>
  <style>.title{font:700 25px Georgia,serif;fill:#4f3a25}.lab{font:700 20px Georgia,serif;fill:#4f3a25;text-anchor:middle}.grid{fill:#f4e6c7;stroke:#8a6a42;stroke-width:2}.line{stroke:#b4976f;stroke-width:1}.mark{font:700 24px Georgia,serif;fill:#3e2d1e;text-anchor:middle;dominant-baseline:middle}.note{font:700 22px Georgia,serif;fill:#3e2d1e}.ch{fill:#fff2a6;stroke:#7b5b2e;stroke-width:2}.frag{fill:#ead7ae;stroke:#7d5b36;stroke-width:3;stroke-dasharray:9 5}</style>
  <text x="40" y="42" class="title">Base map</text>
  <g transform="translate(45 70)">
    <rect width="350" height="350" class="grid"/>
    <path d="M50 0v350M100 0v350M150 0v350M200 0v350M250 0v350M300 0v350M0 50h350M0 100h350M0 150h350M0 200h350M0 250h350M0 300h350" class="line"/>
    <text x="125" y="75" class="mark">T</text><text x="175" y="175" class="mark">W</text>
    <rect x="100" y="200" width="50" height="50" class="ch"/><text x="125" y="225" class="mark">1</text>
    <rect x="200" y="200" width="50" height="50" class="ch"/><text x="225" y="225" class="mark">2</text>
    <rect x="100" y="300" width="50" height="50" class="ch"/><text x="125" y="325" class="mark">3</text>
    <rect x="200" y="300" width="50" height="50" class="ch"/><text x="225" y="325" class="mark">4</text>
  </g>
  <text x="555" y="42" class="title">Fragments (shown in their found orientations)</text>
  <!-- Fragment A: displayed B . T -->
  <text x="650" y="92" class="lab">Fragment A</text>
  <g transform="translate(540 110)"><path d="M0 0h240v90H0z" class="frag"/><path d="M80 0v90M160 0v90" class="line"/><text x="40" y="45" class="mark">B</text><text x="200" y="45" class="mark">T</text></g>
  <!-- Fragment B: . . B / R . W -->
  <text x="940" y="92" class="lab">Fragment B</text>
  <g transform="translate(820 110)"><path d="M0 0h240v160H0z" class="frag"/><path d="M80 0v160M160 0v160M0 80h240" class="line"/><text x="200" y="40" class="mark">B</text><text x="40" y="120" class="mark">R</text><text x="200" y="120" class="mark">W</text></g>
  <!-- Fragment C: . X . / W . R -->
  <text x="800" y="335" class="lab">Fragment C</text>
  <g transform="translate(620 355)"><path d="M0 0h360v180H0z" class="frag"/><path d="M120 0v180M240 0v180M0 90h360" class="line"/><text x="180" y="45" class="mark">X</text><text x="60" y="135" class="mark">W</text><text x="300" y="135" class="mark">R</text></g>
  <text x="45" y="480" class="title">Landmarks</text>
  <text x="45" y="520" class="note">T = tower   ·   W = well   ·   B = bridge   ·   R = tree</text>
  <text x="45" y="695" class="title">Fragments may be rotated by quarter-turns, but never flipped.</text>
</svg>
