<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Five successive sorting-scanner states</title><desc id="desc">Five rows show crates of heights one through five in changing order. A blue arrow sits in a gap between adjacent crates and points left or right.</desc>
  <style>.row{fill:#f8fafc;stroke:#a0acbb;stroke-width:1.5}.crate{fill:#e7c690;stroke:#74542c;stroke-width:2}.num{font:700 18px system-ui,sans-serif;fill:#242017;text-anchor:middle}.state{font:700 18px system-ui,sans-serif;fill:#172033}.arrow{font:700 30px system-ui,sans-serif;fill:#1267a8;text-anchor:middle}</style>
  <!-- crate centers 250,340,430,520,610; gaps 295,385,475,565 -->
  <g transform="translate(0,15)"><rect x="20" y="0" width="850" height="88" rx="9" class="row"/><text x="42" y="48" class="state">State 1</text><g class="crate"><rect x="220" y="24" width="60" height="48"/><rect x="310" y="51" width="60" height="21"/><rect x="400" y="12" width="60" height="60"/><rect x="490" y="42" width="60" height="30"/><rect x="580" y="33" width="60" height="39"/></g><g class="num"><text x="250" y="55">4</text><text x="340" y="69">1</text><text x="430" y="50">5</text><text x="520" y="65">2</text><text x="610" y="60">3</text></g><text x="385" y="34" class="arrow">→</text></g>
  <g transform="translate(0,112)"><rect x="20" y="0" width="850" height="88" rx="9" class="row"/><text x="42" y="48" class="state">State 2</text><g class="crate"><rect x="220" y="24" width="60" height="48"/><rect x="310" y="51" width="60" height="21"/><rect x="400" y="12" width="60" height="60"/><rect x="490" y="42" width="60" height="30"/><rect x="580" y="33" width="60" height="39"/></g><g class="num"><text x="250" y="55">4</text><text x="340" y="69">1</text><text x="430" y="50">5</text><text x="520" y="65">2</text><text x="610" y="60">3</text></g><text x="475" y="34" class="arrow">→</text></g>
  <g transform="translate(0,209)"><rect x="20" y="0" width="850" height="88" rx="9" class="row"/><text x="42" y="48" class="state">State 3</text><g class="crate"><rect x="220" y="24" width="60" height="48"/><rect x="310" y="51" width="60" height="21"/><rect x="400" y="42" width="60" height="30"/><rect x="490" y="12" width="60" height="60"/><rect x="580" y="33" width="60" height="39"/></g><g class="num"><text x="250" y="55">4</text><text x="340" y="69">1</text><text x="430" y="65">2</text><text x="520" y="50">5</text><text x="610" y="60">3</text></g><text x="385" y="34" class="arrow">←</text></g>
  <g transform="translate(0,306)"><rect x="20" y="0" width="850" height="88" rx="9" class="row"/><text x="42" y="48" class="state">State 4</text><g class="crate"><rect x="220" y="24" width="60" height="48"/><rect x="310" y="51" width="60" height="21"/><rect x="400" y="42" width="60" height="30"/><rect x="490" y="12" width="60" height="60"/><rect x="580" y="33" width="60" height="39"/></g><g class="num"><text x="250" y="55">4</text><text x="340" y="69">1</text><text x="430" y="65">2</text><text x="520" y="50">5</text><text x="610" y="60">3</text></g><text x="295" y="34" class="arrow">←</text></g>
  <g transform="translate(0,403)"><rect x="20" y="0" width="850" height="88" rx="9" class="row"/><text x="42" y="48" class="state">State 5</text><g class="crate"><rect x="220" y="51" width="60" height="21"/><rect x="310" y="24" width="60" height="48"/><rect x="400" y="42" width="60" height="30"/><rect x="490" y="12" width="60" height="60"/><rect x="580" y="33" width="60" height="39"/></g><g class="num"><text x="250" y="69">1</text><text x="340" y="55">4</text><text x="430" y="65">2</text><text x="520" y="50">5</text><text x="610" y="60">3</text></g><text x="385" y="34" class="arrow">→</text></g>
</svg>
