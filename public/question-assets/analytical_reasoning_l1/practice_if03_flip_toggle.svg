<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">Two examples and a target for a card transformation</title>
  <desc id="desc">Two-by-two cards show a top-bottom reflection combined with a fill change. Four answer cards follow the target.</desc>
  <defs>
    <g id="grid">
      <rect x="0" y="0" width="150" height="150" rx="5" fill="#fff" stroke="#596a80" stroke-width="3"/>
      <line x1="75" y1="0" x2="75" y2="150" stroke="#aab5c3" stroke-width="2"/>
      <line x1="0" y1="75" x2="150" y2="75" stroke="#aab5c3" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1080" height="760" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26364d">
    <text x="45" y="48" font-size="26" font-weight="700">EXAMPLES</text>
    <g font-size="22" font-weight="700" text-anchor="middle">
      <text x="155" y="88">BEFORE</text><text x="445" y="88">AFTER</text>
      <text x="720" y="88">BEFORE</text><text x="980" y="88">AFTER</text>
    </g>
    <g transform="translate(80 105)"><use href="#grid"/></g>
    <g transform="translate(370 105)"><use href="#grid"/></g>
    <g transform="translate(645 105)"><use href="#grid"/></g>
    <g transform="translate(905 105)"><use href="#grid"/></g>
    <g font-family="Apple Symbols, Arial Unicode MS, sans-serif" font-size="47" text-anchor="middle">
      <text x="118" y="163">▲</text><text x="193" y="238">○</text>
      <text x="408" y="238">△</text><text x="483" y="163">●</text>
      <text x="758" y="163">■</text><text x="683" y="238">◇</text>
      <text x="943" y="163">◆</text><text x="1018" y="238">□</text>
    </g>
    <g font-size="42" font-weight="700" text-anchor="middle">
      <text x="300" y="195">→</text><text x="840" y="195">→</text>
    </g>

    <text x="45" y="330" font-size="26" font-weight="700">TARGET</text>
    <g transform="translate(80 355)"><use href="#grid"/></g>
    <g font-family="Apple Symbols, Arial Unicode MS, sans-serif" font-size="47" text-anchor="middle">
      <text x="118" y="413">●</text><text x="118" y="488">△</text><text x="193" y="488">■</text>
    </g>
    <text x="280" y="453" font-size="42" font-weight="700" text-anchor="middle">→</text>
    <text x="360" y="453" font-size="22" fill="#64748b">?</text>

    <g transform="translate(80 555)"><use href="#grid"/></g>
    <g transform="translate(320 555)"><use href="#grid"/></g>
    <g transform="translate(560 555)"><use href="#grid"/></g>
    <g transform="translate(800 555)"><use href="#grid"/></g>
    <g font-family="Apple Symbols, Arial Unicode MS, sans-serif" font-size="43" text-anchor="middle">
      <text x="118" y="613">▲</text><text x="193" y="613">□</text><text x="118" y="688">○</text>
      <text x="358" y="613">△</text><text x="433" y="613">■</text><text x="358" y="688">●</text>
      <text x="598" y="613">○</text><text x="598" y="688">▲</text><text x="673" y="688">□</text>
      <text x="913" y="613">○</text><text x="838" y="688">□</text><text x="913" y="688">▲</text>
    </g>
  </g>
</svg>
