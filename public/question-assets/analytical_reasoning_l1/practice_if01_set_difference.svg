<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Three examples of removing shared symbols</title>
  <desc id="desc">A three-row table with columns First group, Remove, and Result. The third result is unknown.</desc>
  <rect width="900" height="390" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#26364d">
    <g font-size="25" font-weight="700" text-anchor="middle">
      <text x="190" y="48">FIRST GROUP</text>
      <text x="450" y="48">REMOVE</text>
      <text x="710" y="48">RESULT</text>
    </g>
    <g stroke="#9aa8ba" stroke-width="2" fill="none">
      <rect x="45" y="70" width="810" height="270" rx="8"/>
      <line x1="320" y1="70" x2="320" y2="340"/>
      <line x1="580" y1="70" x2="580" y2="340"/>
      <line x1="45" y1="160" x2="855" y2="160"/>
      <line x1="45" y1="250" x2="855" y2="250"/>
    </g>
    <g font-family="Apple Symbols, Arial Unicode MS, sans-serif" font-size="46" text-anchor="middle">
      <text x="182" y="130">▲  ■  ●</text>
      <text x="450" y="130">■</text>
      <text x="710" y="130">▲  ●</text>

      <text x="182" y="220">◆  ★  ●</text>
      <text x="450" y="220">◆  ●</text>
      <text x="710" y="220">★</text>

      <text x="182" y="310">▲  ■  ◆</text>
      <text x="450" y="310">■  ◆</text>
      <text x="710" y="310" font-family="Arial, Helvetica, sans-serif" font-weight="700">[?]</text>
    </g>
  </g>
</svg>
