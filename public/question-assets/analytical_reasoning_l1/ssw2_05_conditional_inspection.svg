<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-labelledby="title desc">
  <title id="title">Four conditional inspection cards</title>
  <desc id="desc">A: solid and hollow triangles become solid square and solid triangle. B: the same start becomes solid square and hollow triangle. C: solid triangle and hollow circle become hollow square and solid diamond. D: the same start becomes hollow triangle and solid diamond.</desc>
  <rect width="860" height="440" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#0f172a" dominant-baseline="middle">
    <g stroke="#cbd5e1" stroke-width="2" fill="#f8fafc"><rect x="80" y="25" width="700" height="82" rx="9"/><rect x="80" y="127" width="700" height="82" rx="9"/><rect x="80" y="229" width="700" height="82" rx="9"/><rect x="80" y="331" width="700" height="82" rx="9"/></g>
    <g font-size="40" text-anchor="middle">
      <text x="230" y="66">▲</text><text x="300" y="66">△</text><text x="430" y="66" font-size="30">→</text><text x="560" y="66">■</text><text x="630" y="66">▲</text>
      <text x="230" y="168">▲</text><text x="300" y="168">△</text><text x="430" y="168" font-size="30">→</text><text x="560" y="168">■</text><text x="630" y="168">△</text>
      <text x="230" y="270">▲</text><text x="300" y="270">○</text><text x="430" y="270" font-size="30">→</text><text x="560" y="270">□</text><text x="630" y="270">◆</text>
      <text x="230" y="372">▲</text><text x="300" y="372">○</text><text x="430" y="372" font-size="30">→</text><text x="560" y="372">△</text><text x="630" y="372">◆</text>
    </g>
  </g>
</svg>
