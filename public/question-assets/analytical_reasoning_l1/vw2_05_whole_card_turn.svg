<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Whole-card movement example, target, and four answer cards</title>
  <desc id="desc">An example shows a three by three card before and after a whole-card movement. A target card and four possible transformed cards are shown. X marks an empty position.</desc>
  <style>.grid{fill:#fff;stroke:#263b58;stroke-width:3}.line{stroke:#a8b2bf;stroke-width:2}.lab{font:700 22px sans-serif;fill:#243a57;text-anchor:middle}.sym{font:700 31px "DejaVu Sans",sans-serif;fill:#243a57;text-anchor:middle;dominant-baseline:middle}.move{font:700 42px sans-serif;fill:#b34f2c;text-anchor:middle;dominant-baseline:middle}.opt{font:700 24px sans-serif;fill:#243a57}</style>
  <rect width="1180" height="720" fill="#fff"/>
  <defs><g id="g3"><rect class="grid" width="216" height="216" rx="6"/><path class="line" d="M72 0V216M144 0V216M0 72H216M0 144H216"/></g></defs>
  <text class="lab" x="245" y="38">EXAMPLE: BEFORE</text><text class="lab" x="585" y="38">EXAMPLE: AFTER</text>
  <g transform="translate(137 62)"><use href="#g3"/><text class="sym" x="36" y="36">▲</text><text class="sym" x="108" y="36">×</text><text class="sym" x="180" y="36">→</text><text class="sym" x="36" y="108">×</text><text class="sym" x="108" y="108">■</text><text class="sym" x="180" y="108">×</text><text class="sym" x="36" y="180">●</text><text class="sym" x="108" y="180">×</text><text class="sym" x="180" y="180">×</text></g>
  <text class="move" x="415" y="170">→</text>
  <g transform="translate(477 62)"><use href="#g3"/><text class="sym" x="36" y="36">×</text><text class="sym" x="108" y="36">×</text><text class="sym" x="180" y="36">●</text><text class="sym" x="36" y="108">×</text><text class="sym" x="108" y="108">■</text><text class="sym" x="180" y="108">×</text><text class="sym" x="36" y="180">←</text><text class="sym" x="108" y="180">×</text><text class="sym" x="180" y="180">▲</text></g>
  <text class="lab" x="925" y="38">TARGET</text>
  <g transform="translate(817 62)"><use href="#g3"/><text class="sym" x="36" y="36">◆</text><text class="sym" x="108" y="36">×</text><text class="sym" x="180" y="36">×</text><text class="sym" x="36" y="108">×</text><text class="sym" x="108" y="108">↑</text><text class="sym" x="180" y="108">○</text><text class="sym" x="36" y="180">■</text><text class="sym" x="108" y="180">×</text><text class="sym" x="180" y="180">×</text></g>
  <text class="lab" x="590" y="332">ANSWER CARDS</text>
  <g transform="translate(45 365)"><text class="opt" x="0" y="25">A</text><g transform="translate(38 0)"><use href="#g3"/><text class="sym" x="36" y="36">■</text><text class="sym" x="108" y="36">×</text><text class="sym" x="180" y="36">×</text><text class="sym" x="36" y="108">×</text><text class="sym" x="108" y="108">↓</text><text class="sym" x="180" y="108">○</text><text class="sym" x="36" y="180">×</text><text class="sym" x="108" y="180">×</text><text class="sym" x="180" y="180">◆</text></g></g>
  <g transform="translate(325 365)"><text class="opt" x="0" y="25">B</text><g transform="translate(38 0)"><use href="#g3"/><text class="sym" x="36" y="36">×</text><text class="sym" x="108" y="36">×</text><text class="sym" x="180" y="36">■</text><text class="sym" x="36" y="108">×</text><text class="sym" x="108" y="108">↓</text><text class="sym" x="180" y="108">○</text><text class="sym" x="36" y="180">◆</text><text class="sym" x="108" y="180">×</text><text class="sym" x="180" y="180">×</text></g></g>
  <g transform="translate(605 365)"><text class="opt" x="0" y="25">C</text><g transform="translate(38 0)"><use href="#g3"/><text class="sym" x="36" y="36">×</text><text class="sym" x="108" y="36">×</text><text class="sym" x="180" y="36">◆</text><text class="sym" x="36" y="108">○</text><text class="sym" x="108" y="108">↑</text><text class="sym" x="180" y="108">×</text><text class="sym" x="36" y="180">■</text><text class="sym" x="108" y="180">×</text><text class="sym" x="180" y="180">×</text></g></g>
  <g transform="translate(885 365)"><text class="opt" x="0" y="25">D</text><g transform="translate(38 0)"><use href="#g3"/><text class="sym" x="36" y="36">×</text><text class="sym" x="108" y="36">×</text><text class="sym" x="180" y="36">■</text><text class="sym" x="36" y="108">○</text><text class="sym" x="108" y="108">↓</text><text class="sym" x="180" y="108">×</text><text class="sym" x="36" y="180">×</text><text class="sym" x="108" y="180">×</text><text class="sym" x="180" y="180">◆</text></g></g>
</svg>
