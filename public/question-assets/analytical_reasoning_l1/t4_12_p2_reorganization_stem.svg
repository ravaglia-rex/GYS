<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1330" viewBox="0 0 1200 1330" role="img" aria-labelledby="title desc">
  <title id="title">Two reorganization examples and target hierarchy</title><desc id="desc">Two examples show a promoted manager becoming leader and the former leader managing reports whose badge shape matches the former leader's badge. The target promotes N under former leader M.</desc>
  <style>
    .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#b8c5d0;stroke-width:2}.heading{font:700 25px sans-serif;fill:#243a57;text-anchor:middle}.section{font:700 24px sans-serif;fill:#174a78}.sub{font:700 19px sans-serif;fill:#3b5060;text-anchor:middle}.role{font:700 16px sans-serif;fill:#526a84;text-anchor:middle}.cell{stroke:#263b58;stroke-width:2.5}.inside{fill:#eef5fb}.clipped{fill:#fff4e9}.loose{fill:#f4f1f8}.arrow{fill:none;stroke:#d26928;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.route{font:700 22px sans-serif;fill:#8f4f17;text-anchor:middle}.divider{stroke:#d8e0e6;stroke-width:2}.edge{fill:none;stroke:#526b7b;stroke-width:2.4;stroke-linejoin:round}.node{fill:#fff;stroke:#253b4d;stroke-width:2.2}.promoted{fill:#fff3d9;stroke:#a86200;stroke-width:3}.person{font:700 19px sans-serif;fill:#173f63;text-anchor:middle;dominant-baseline:middle}.tag{font:700 13px sans-serif;fill:#8b5000;text-anchor:middle}.mark-solid{fill:#173f63;stroke:#173f63;stroke-width:3}.mark-hollow{fill:#fff;stroke:#173f63;stroke-width:3}
  </style>

