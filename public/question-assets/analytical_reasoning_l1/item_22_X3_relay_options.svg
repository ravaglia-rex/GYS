  <g transform="translate(530,30)"><rect width="440" height="210" rx="10" class="panel"/><text x="18" y="32" class="head">B</text><path d="M95 65L210 155 L325 65 L95 65 M210 155L75 190 M75 190L345 190" class="edge" fill="none"/><g class="node"><circle cx="95" cy="65" r="23"/><circle cx="210" cy="155" r="23"/><circle cx="325" cy="65" r="23"/><circle cx="75" cy="190" r="23"/><circle cx="345" cy="190" r="23"/></g><g class="lab"><text x="95" y="65">P</text><text x="210" y="155">Q</text><text x="325" y="65">R</text><text x="75" y="190">S</text><text x="345" y="190">T</text></g></g>
