<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Four possible communication networks after relay retirement</title><desc id="desc">Four equal-sized options contain stations P, Q, R, S, and T with five connections arranged differently.</desc>
  <style>.panel{fill:#f8fafc;stroke:#9aa7b8;stroke-width:2}.edge{stroke:#46566b;stroke-width:5}.node{fill:#dcecff;stroke:#336b9f;stroke-width:2}.lab{font:700 19px system-ui,sans-serif;fill:#172033;text-anchor:middle;dominant-baseline:central}.head{font:700 22px system-ui,sans-serif;fill:#172033}</style>
  <!-- positions: P 95,65; Q 210,155; R 325,65; S 75,190; T 345,190 -->
