<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Four block positions on upper and floor levels</title>
  <desc id="desc">Two aligned three-by-three grids show the upper and floor levels. The upper level has a diamond in the center cell. The floor level has a triangle in the lower-left cell, a square immediately to its right, and a circle immediately above the square. An east-side observer stands to the right of the floor grid looking left.</desc>
  <style>
    .panel{fill:#fff;stroke:#263b58;stroke-width:4}
    .upper{fill:#f6f1fb}.floor{fill:#f2f7fb}
    .line{stroke:#aab7c5;stroke-width:2.5}
    .symbol{font:700 56px "DejaVu Sans",sans-serif;fill:#152e4e;text-anchor:middle;dominant-baseline:middle}
    .head{font:700 27px sans-serif;fill:#243a57;text-anchor:middle}
    .obs{fill:#e9f0f6;stroke:#263b58;stroke-width:3}
    .sight{fill:none;stroke:#d26928;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1000" height="760" fill="#fff"/>
  <text class="head" x="330" y="40">BLOCK POSITIONS BY LEVEL</text>

  <text class="head" x="330" y="86">UPPER LEVEL</text>
  <g transform="translate(225 104)">
    <rect class="panel upper" width="210" height="210" rx="7"/>
    <path class="line" d="M70 0V210M140 0V210M0 70H210M0 140H210"/>
    <text class="symbol" x="105" y="105">◆</text>
  </g>

  <text class="head" x="330" y="400">FLOOR LEVEL</text>
  <g transform="translate(225 418)">
    <rect class="panel floor" width="210" height="210" rx="7"/>
    <path class="line" d="M70 0V210M140 0V210M0 70H210M0 140H210"/>
    <text class="symbol" x="35" y="175">▲</text>
    <text class="symbol" x="105" y="175">■</text>
    <text class="symbol" x="105" y="105">●</text>
  </g>

  <g transform="translate(570 458)">
    <circle class="obs" cx="45" cy="25" r="23"/>
    <path class="obs" d="M14 103Q18 52 45 52T76 103Z"/>
    <path class="sight" d="M6 55H-95M-95 55l22-14M-95 55l22 14"/>
    <text class="head" x="45" y="143">EAST-SIDE</text>
    <text class="head" x="45" y="175">OBSERVER</text>
  </g>
</svg>
