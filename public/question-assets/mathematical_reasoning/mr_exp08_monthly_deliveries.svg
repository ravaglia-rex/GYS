<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Packages delivered in January and February</title>
  <desc id="desc">A bar graph. January shows 1,000 packages delivered. February shows 1,100 packages delivered.</desc>
  <rect width="640" height="360" fill="white"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700">Packages delivered</text>
  <line x1="90" y1="300" x2="590" y2="300" stroke="#111" stroke-width="2"/>
  <line x1="90" y1="60" x2="90" y2="300" stroke="#111" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#111">
    <text x="78" y="305" text-anchor="end">0</text>
    <text x="78" y="245" text-anchor="end">400</text>
    <text x="78" y="185" text-anchor="end">800</text>
    <text x="78" y="125" text-anchor="end">1,200</text>
    <text x="28" y="180" transform="rotate(-90 28 180)" text-anchor="middle">Packages</text>
  </g>
  <g stroke="#b5b5b5" stroke-width="1">
    <line x1="90" y1="240" x2="590" y2="240"/>
    <line x1="90" y1="180" x2="590" y2="180"/>
    <line x1="90" y1="120" x2="590" y2="120"/>
    <line x1="90" y1="60" x2="590" y2="60"/>
  </g>
  <rect x="190" y="100" width="110" height="200" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <rect x="390" y="80" width="110" height="220" fill="white" stroke="#111" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#111" text-anchor="middle">
    <text x="245" y="90" font-weight="700">1,000</text>
    <text x="445" y="70" font-weight="700">1,100</text>
    <text x="245" y="325">January</text>
    <text x="445" y="325">February</text>
  </g>
</svg>
