<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="title desc">
  <title id="title">Rectangular field with a one-metre path inside its boundary</title>
  <desc id="desc">A ten metre by six metre rectangle contains a uniform one metre wide path along all four inside edges. The central unshaded rectangle is grass.</desc>
  <rect width="680" height="420" fill="white"/>
  <rect x="110" y="75" width="460" height="276" fill="#d9d9d9" stroke="#111" stroke-width="3"/>
  <rect x="187" y="152" width="306" height="122" fill="white" stroke="#111" stroke-width="2"/>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="340" y="45" text-anchor="middle" font-size="18" font-weight="700">10 m</text>
    <text x="72" y="220" text-anchor="middle" font-size="18" transform="rotate(-90 72 220)" font-weight="700">6 m</text>
    <text x="340" y="220" text-anchor="middle" font-size="20">grass</text>
    <text x="145" y="125" text-anchor="middle" font-size="16">path</text>
    <text x="225" y="140" text-anchor="middle" font-size="15">1 m</text>
  </g>
  <line x1="187" y1="132" x2="187" y2="151" stroke="#111" stroke-width="2"/>
  <line x1="110" y1="132" x2="110" y2="151" stroke="#111" stroke-width="2"/>
  <line x1="110" y1="141" x2="187" y2="141" stroke="#111" stroke-width="2"/>
  <path d="M118 136 L110 141 L118 146" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M179 136 L187 141 L179 146" fill="none" stroke="#111" stroke-width="2"/>
  <text x="340" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">Diagram not drawn to scale.</text>
</svg>
