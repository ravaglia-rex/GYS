<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Two right triangles with equal corresponding angles</title>
  <desc id="desc">Triangle PQR is a 3-4-5 right triangle. Triangle XYZ is a 6-8-10 right triangle. Corresponding angles are equal.</desc>
  <rect width="760" height="300" fill="white"/>
  <g stroke="#111" stroke-width="2.5" fill="none">
    <path d="M80 240 L80 120 L240 240 Z"/>
    <path d="M80 220 L100 220 L100 240" stroke-width="2"/>
    <path d="M420 250 L420 90 L660 250 Z"/>
    <path d="M420 230 L440 230 L440 250" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#111">
    <text x="68" y="248" text-anchor="end" font-weight="700">P</text>
    <text x="68" y="116" text-anchor="end" font-weight="700">Q</text>
    <text x="252" y="248" font-weight="700">R</text>
    <text x="160" y="258" text-anchor="middle">4</text>
    <text x="58" y="184" text-anchor="end">3</text>
    <text x="168" y="168" transform="rotate(-37 168 168)" text-anchor="middle">5</text>
    <text x="160" y="36" text-anchor="middle" font-weight="700">Triangle PQR</text>

    <text x="408" y="258" text-anchor="end" font-weight="700">X</text>
    <text x="408" y="86" text-anchor="end" font-weight="700">Y</text>
    <text x="672" y="258" font-weight="700">Z</text>
    <text x="540" y="272" text-anchor="middle">8</text>
    <text x="398" y="176" text-anchor="end">6</text>
    <text x="548" y="152" transform="rotate(-34 548 152)" text-anchor="middle">10</text>
    <text x="540" y="36" text-anchor="middle" font-weight="700">Triangle XYZ</text>
  </g>
</svg>
